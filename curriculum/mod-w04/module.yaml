objective_source: "Topik dan tujuan ringkas CUR §2 baris 4 (kerangka D-01 M-02). Rumusan LO rinci disusun penyusun mengikuti pola W1 (CU-1 tetap PROPOSED) — bukan keputusan owner baru"
safety_scope: "Defensif dan edukatif. Semua skenario, tokoh, akun, domain (.example/.test), dan data fiktif. Tidak ada akses ke akun/kredensial nyata, malware, sistem pihak ketiga, atau jaringan tanpa izin; tidak ada instruksi menyerang; tidak menjanjikan keamanan mutlak"

learning_objectives:
  - id: LO1
    competency: comp-w04-cia-01
    text: "Menjelaskan kerahasiaan, integritas, dan ketersediaan, serta menentukan tujuan yang terutama terganggu pada sebuah kejadian"
  - id: LO2
    competency: comp-w04-threat-01
    text: "Mengenali phishing, rekayasa sosial, virus, trojan, ransomware, spyware, dan Wi-Fi palsu dari ciri dan tandanya"
  - id: LO3
    competency: comp-w04-auth-01
    text: "Menjelaskan faktor autentikasi dan MFA, menghitung kombinasi PIN, dan memilih kebiasaan kata sandi yang kuat"
  - id: LO4
    competency: comp-w04-phish-01
    text: "Menemukan domain terdaftar dari alamat situs (model W4), mengenali tanda phishing, dan memilih respons aman"
  - id: LO5
    competency: comp-w04-protect-01
    text: "Memilih praktik perlindungan (pembaruan, sumber resmi, izin aplikasi, kunci layar, antimalware) dan memeriksa rencana cadangan 3-2-1"
  - id: LO6
    competency: comp-w04-incident-01
    text: "Mengurutkan langkah respons insiden pribadi dan memilih tindakan yang etis"


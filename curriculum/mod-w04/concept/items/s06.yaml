  item_version: '1.0'
  stem: Ponselmu hilang di angkutan umum. Kamu sudah menelepon operator lewat kanal resmi untuk memblokir
    kartu SIM (langkah itu boleh dilakukan kapan saja dan tidak diurutkan di sini). Dengan urutan respons
    Pelajaran 4 (hentikan → amankan), urutkan langkah berikut.
  items:
  - id: A
    text: Dari laptop di rumah, masuk ke layanan "temukan perangkat" untuk ponsel itu
  - id: B
    text: Lewat layanan itu, kunci ponsel dari jarak jauh dan tampilkan pesan kontak
  - id: C
    text: Ganti kata sandi akun penting yang masuk di ponsel itu
  - id: D
    text: Keluarkan ponsel yang hilang dari daftar perangkat yang masuk di akun-akun itu
  display_order:

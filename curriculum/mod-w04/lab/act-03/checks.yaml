      terutama terganggu?
    options: *id001
    expected: c
    points: 5
  - check_id: mod-w04.lab.act-03.vB.c02
    name: MFA
    question: Pasangan mana yang merupakan MFA?
    options:
    - id: a
      text: Kata sandi + sidik jari
    - id: b
      text: Kata sandi + PIN
    - id: c
      text: PIN + tanggal lahir
    - id: d

  - check_id: mod-w04.lab.act-03.vB.c03
    name: Kombinasi PIN
    question: Berapa jumlah PIN 8 digit yang berbeda (angka 0–9; boleh diawali 0 dan berulang)?
    accepted_answers:
    - '100000000'

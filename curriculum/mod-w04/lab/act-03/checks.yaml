    points: 5
normalization_examples:
  c03 (kunci 10000000, vA):
    diterima:
    - '10000000'
    - 10.000.000
    - 10000000 kombinasi
    - 10.000.000kombinasi
    ditolak (0 poin):
    - '010000000'

primary_classification_rule: 'Aturan berurutan (F-52; pakai aturan pertama yang cocok, sehingga setiap
  skenario punya tepat satu kunci): (1) mengunci/mengenkripsi + tebusan → RAN; (2) program yang menyamar
  sebagai program berguna → TRO; (3) program yang memata-matai tanpa disebut menyamar → SPY; (4) jaringan
  Wi-Fi tiruan/mencurigakan dengan bukti perilaku, termasuk halaman peminta data yang muncul dari jaringan
  itu → WIF; (5) pesan/situs/formulir penyamar lewat email, SMS, chat, atau tautan yang memancing data
  → PHI; (6) manipulasi langsung (telepon/tatap muka) tanpa tautan/situs palsu → SOS; (7) bila tidak ada
  yang cocok: tindakan pengguna yang tepat lewat kanal resmi, tanpa bukti cukup untuk enam kategori ancaman
  → AMN. AMN menilai ketepatan tindakan pengguna atau tidak cukupnya bukti ancaman dalam skenario, BUKAN
  jaminan tidak ada ancaman (mis. vB S10: login dari perangkat baru tetap dapat berupa insiden; bila login
  itu bukan dirimu, amankan akun — Pelajaran 4). Setiap skenario yang berkunci ancaman memuat bukti perilaku,
  bukan hanya gejala'

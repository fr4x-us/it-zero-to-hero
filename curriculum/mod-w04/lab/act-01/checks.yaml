# W4 — pemeriksaan lab (kunci; tidak ditampilkan sebelum dievaluasi)
activity_id: mod-w04.lab.act-01
name: Mengenali ancaman dari skenario
competencies:
- comp-w04-threat-01
max_points: 30
estimated_minutes: 30
content_version: '1.0'
xp: Tidak ada identitas XP per aktivitas; XP pada identitas komponen mod-w04.lab (D-28 XI-2)
normalization: Satu kode dari {PHI, SOS, TRO, RAN, SPY, WIF, AMN}; buang spasi tepi; ubah ke huruf besar.
  Kunci = kategori UTAMA menurut ciri paling menonjol (lihat primary_classification_rule)
answer_validation: Kosong atau kode di luar himpunan → 0 untuk pemeriksaan itu; pemeriksaan lain tetap
  dinilai
infrastructure: Kegagalan infrastruktur/konten → EVALUATION_ERROR, evaluasi diulang dari submission yang
  sama tanpa attempt baru (D-24 IE-2)
feedback_stage: 'Setelah aktivitas dievaluasi: benar/salah per pemeriksaan + pembahasan. W4 tidak memiliki
  test kode tersembunyi (D-36 HF-A tidak berlaku)'
runtime: Tidak memerlukan runtime Python atau jaringan; pemeriksaan deterministik atas jawaban terstruktur
safety: Semua skenario, nama, domain (.example/.test), dan pesan fiktif. Tidak ada akses ke akun nyata,
  kredensial nyata, malware, sistem pihak ketiga, atau jaringan tanpa izin; tidak ada tautan yang dibuka

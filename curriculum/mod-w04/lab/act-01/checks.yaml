  fixture:
    scenarios:
    - id: S1
      text: 'SMS: "Selamat! Kamu menang Rp5.000.000. Klaim di tautan dan isi nomor rekening serta PIN-mu."'
    - id: S2
      text: Pemberitahuan pembaruan sistem muncul di menu Pengaturan ponsel, dan kamu memasangnya dari
        menu Pengaturan itu.
    - id: S3
      text: Orang tak dikenal di kantin meminjam ponselmu "untuk menelepon", lalu memintamu membacakan
        kode yang baru masuk.
    - id: S4
      text: Aplikasi yang tampak seperti "kalkulator gratis" dari situs unduhan tak resmi ternyata diam-diam
        memasang program jahat yang membuka akses dari jarak jauh.
    - id: S5
      text: Semua berkas di flashdisk klub berganti ekstensi menjadi `.kunci`, dan ada berkas berisi permintaan
        tebusan.
    - id: S6
      text: Di kafe muncul Wi-Fi terbuka "Kafe_Gratis_Free", padahal kasir menyebut Wi-Fi resmi bernama
        "KafeSenja" dengan sandi tertulis di struk. Setelah tersambung ke "Kafe_Gratis_Free", muncul halaman
        yang meminta kata sandi akun emailmu agar internet aktif.
    - id: S7
      text: Email "tim keamanan" berkata akunmu diblokir dalam 2 jam; tautannya menuju domain yang bukan
        milik penyedia akun.
    - id: S8
      text: Kamu membuka aplikasi bank resmi dari ikon aplikasi yang dipasang dari toko aplikasi resmi,
        lalu masuk dengan MFA.
    - id: S9
      text: Program tersembunyi di laptop bersama merekam setiap ketikan dan mengirimkannya ke server
        asing.
    - id: S10
      text: Guru mengumumkan sandi Wi-Fi sekolah diganti; sandi baru dibagikan lewat papan pengumuman
        resmi di ruang guru.

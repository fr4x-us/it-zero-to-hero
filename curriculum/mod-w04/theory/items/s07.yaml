  stem: 'Pilih kategori **utama** menurut ciri yang paling menonjol (Pelajaran 1 §2): menyamar sebagai
    program berguna → trojan; memata-matai tanpa disebut menyamar → spyware; mengunci + tebusan → ransomware;
    pesan/situs penyamar yang memancing data → phishing. Klasifikasikan ketiga kejadian. Pilihan mana
    yang **seluruhnya** benar?'

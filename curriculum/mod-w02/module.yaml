# W2 — ikhtisar modul (TPL-01, TPL-02, TPL-03, TPL-15, TPL-17, TPL-18). Dokumentasi konten; bukan kode aplikasi.
module_id: mod-w02
phase: phase-1
week: 2
title: "Sistem Operasi dan Manajemen Berkas"
locked_scope: "W2 OS dan file (B01 M-02, D-01 M-02; CUR §2 baris 2: fungsi OS, proses, sistem file; lab simulasi struktur folder/path)"
language: id
content_version: "1.0"
status:
  documentation: PRODUCED          # konten lengkap ditulis (CB-1)
  reviewed: CLAUDE_SELF_REVIEW     # review dokumentasi oleh penyusun; lihat review.md
  owner_accepted: NO               # dikoreksi (PR #27, F-28–F-70); menunggu re-review independen dan penerimaan owner
  runtime_verified: NOT_APPLICABLE # W2 tidak memakai runtime Python; aplikasi belum ada
  learner_tested: NO               # estimasi durasi belum diuji dengan pelajar
audience: "Pemula total tanpa pengalaman IT atau pemrograman; telah menyelesaikan W1"
prerequisites: [mod-w01]

objective_source: "Topik dan tujuan ringkas CUR §2 baris 2 (kerangka D-01 M-02). Rumusan LO rinci disusun penyusun mengikuti pola W1 (tujuan rinci per minggu tetap PROPOSED, CU-1) — bukan keputusan owner baru"

learning_objectives:
  - id: LO1
    competency: comp-w02-os-01
    text: "Menjelaskan fungsi sistem operasi (proses, memori, file, perangkat, antarmuka pengguna) dan membedakan sistem operasi dari aplikasi"
  - id: LO2
    competency: comp-w02-proc-01
    text: "Membedakan program dan proses, menjelaskan multitasking, dan memilih proses yang diakhiri dari tabel manajer tugas beserta akibatnya"
  - id: LO3
    competency: comp-w02-fs-01
    text: "Menjelaskan berkas, folder, nama berkas, dan ekstensi (dari titik terakhir), serta membaca pohon folder"
  - id: LO4
    competency: comp-w02-path-01
    text: "Menulis dan menafsirkan path absolut dan path relatif terpendek (termasuk . dan ..) pada model path W2"
  - id: LO5
    competency: comp-w02-ops-01
    text: "Memprediksi hasil operasi buat, salin, pindah, ganti nama, hapus, dan pulihkan pada pohon folder (model operasi W2)"
  - id: LO6
    competency: comp-w02-perm-01
    text: "Menafsirkan tabel izin baca/tulis/jalankan dan memilih izin akun atau aplikasi yang sesuai prinsip hak minimum"


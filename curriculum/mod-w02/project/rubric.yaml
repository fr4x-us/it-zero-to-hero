# W2 — rubrik mini-project (MR-A, D-33). Kunci, contoh jawaban, dan contoh evaluasi
# hanya untuk reviewer/penilai; tidak ditampilkan kepada pelajar sebelum dinilai.
component: mod-w02.project
content_version: "1.0"
max_points: 100
start_state_ref: "spec.md, bagian Keadaan awal"
simulator_model: "Simulator pohon folder memakai model operasi W2 (Pelajaran 4 §1: OP-1–OP-4) dan model path W2 (Pelajaran 3 §3). F1 = keadaan akhir simulator: daftar folder dan lokasi setiap berkas (di luar Tempat Sampah) serta isi Tempat Sampah"

constants:
  base: /home/bima
  required_folders: [/home/bima/ProyekSains, /home/bima/ProyekSains/dokumen, /home/bima/ProyekSains/gambar, /home/bima/ProyekSains/data]
  project_files:      # berkas proyek → folder sasaran (N2)
    sains-laporan.docx: /home/bima/ProyekSains/dokumen
    sains-daftar-pustaka.pdf: /home/bima/ProyekSains/dokumen
    sains-catatan.txt: /home/bima/ProyekSains/dokumen
    sains-foto-akar.jpg: /home/bima/ProyekSains/gambar
    sains-grafik.png: /home/bima/ProyekSains/gambar
    sains-sketsa.png: /home/bima/ProyekSains/gambar
    sains-pengukuran.csv: /home/bima/ProyekSains/data
    sains-suhu.xlsx: /home/bima/ProyekSains/data
    sains-kelembapan.csv: /home/bima/ProyekSains/data
  other_files: [lagu-favorit.mp3, undangan-ulang-tahun.pdf, pemasang-game.exe]   # tetap di /home/bima/Unduhan (N3)

field_rules:
  tree_valid: "F1 sah bila SEMUA terpenuhi: (1) setiap folder ditulis sebagai path absolut sah (path_form.absolute_valid); (2) induk setiap folder baru ada di F1 (folder dasar /home/bima dan /home/bima/Unduhan selalu ada); (3) tidak ada dua simpul (folder/berkas) bernama sama persis di folder yang sama; (4) setiap berkas berada di folder yang ada di F1; (5) tidak ada folder atau berkas di bawah sebuah BERKAS (berkas tidak dapat menjadi induk); (6) nama tanpa spasi atau '/' (aturan nama Pelajaran 3 §3). Simulator dirancang mencegah pelanggaran ini; aturan ini adalah pertahanan dokumentasi untuk submission yang rusak atau dimodifikasi. F1 tidak sah → INVALID_ANSWER untuk F1: semua pemeriksaan yang depends_on F1 bernilai 0; pemeriksaan yang tidak bergantung pada F1 (K2.c02–c05: bentuk F2–F5) tetap dinilai (MR-2). Gangguan simulator/aplikasi saat menyusun F1 → EVALUATION_ERROR (D-24 IE-2), bukan 0"
  location_of: "lokasi(X) = folder tempat berkas bernama X berada di F1 (di luar Tempat Sampah). Terdefinisi hanya bila TEPAT SATU berkas bernama X ada di luar Tempat Sampah; selain itu (0 atau ≥ 2 salinan) tidak terdefinisi"
  tree_changed: "pohon_diubah = F1 memuat ≥ 1 folder yang tidak ada di keadaan awal DAN ≥ 1 berkas proyek berada di dalam /home/bima/ProyekSains (subfolder mana pun)"
  path_form:   # bentuk (K2); dokumentasi, bukan implementasi parser
    outer_whitespace: "Spasi/tab di awal dan akhir dibuang"
    absolute_valid: "Diawali '/'; komponen dipisah tepat satu '/'; tidak ada komponen kosong; tanpa '\\'; tanpa spasi di dalam; tidak diakhiri '/'"
    relative_valid: "Tidak diawali '/'; boleh diawali './'; komponen dipisah tepat satu '/'; tidak ada komponen kosong; tanpa '\\'; tanpa spasi di dalam; tidak diakhiri '/'"
    accepted_examples: {absolute: ["/home/contoh/Resep/kue/bolu.txt", " /home/contoh/a.txt "], relative: ["../kue/bolu.txt", "./../kue/bolu.txt", "kue/bolu.txt"]}
    rejected_examples: {absolute: ["\\home\\contoh\\a.txt (garis miring terbalik)", "/home/contoh/ (diakhiri /)", "/home//contoh (komponen kosong)", "/home/con toh (spasi di dalam)"], relative: ["/kue/bolu.txt (diawali /)", "..\\kue\\bolu.txt", "../kue/ (diakhiri /)"]}
  path_correct: "Benar bila sama persis (huruf besar/kecil dibedakan) dengan path yang dihitung. Path relatif yang dihitung = '../' diulang u kali + sisa path sasaran, dengan u = jumlah komponen folder kerja setelah awalan bersama terpanjang dengan folder sasaran (jalur terpendek); diterima dengan atau tanpa awalan './'"
  number_rule_F5: "Bilangan bulat tanpa tanda/desimal/spasi di dalam, tanpa nol di depan (kecuali '0'); spasi tepi dibuang; boleh diikuti tepat satu spasi atau tanpa spasi lalu kata 'berkas' (huruf besar/kecil bebas). Contoh diterima: '3', ' 3 ', '3 berkas', '3berkas'. Ditolak: 'tiga', '3,0', '+3', '03', '3 file'"
  dependency_rule: "MR-2: pemeriksaan bernilai 0 bila isian/keadaan yang dibutuhkannya tidak valid; pemeriksaan lain tetap dinilai. Tidak ada gerbang nol untuk seluruh rubrik. Setiap depends_on [F1] berarti F1 ada DAN tree_valid"
  final_state_only: "Rubrik menilai KEADAAN AKHIR F1 saja. Riwayat operasi tidak dilacak; pemeriksaan N4 (K3.c03, K3.c04) membuktikan bahwa keadaan akhir tidak memuat folder tambahan, berkas hilang/berganti nama, atau salinan ganda — bukan bahwa tidak pernah ada langkah sementara (mis. dihapus lalu dipulihkan)"

criteria:
  K1:
    name: Kebenaran fungsional
    points: 60
    checks:
      - {id: mod-w02.project.K1.c01, rule: "lokasi(sains-laporan.docx) = /home/bima/ProyekSains/dokumen", depends_on: [F1], points: 4}
      - {id: mod-w02.project.K1.c02, rule: "lokasi(sains-daftar-pustaka.pdf) = /home/bima/ProyekSains/dokumen", depends_on: [F1], points: 4}
      - {id: mod-w02.project.K1.c03, rule: "lokasi(sains-catatan.txt) = /home/bima/ProyekSains/dokumen", depends_on: [F1], points: 4}
      - {id: mod-w02.project.K1.c04, rule: "lokasi(sains-foto-akar.jpg) = /home/bima/ProyekSains/gambar", depends_on: [F1], points: 4}
      - {id: mod-w02.project.K1.c05, rule: "lokasi(sains-grafik.png) = /home/bima/ProyekSains/gambar", depends_on: [F1], points: 4}
      - {id: mod-w02.project.K1.c06, rule: "lokasi(sains-sketsa.png) = /home/bima/ProyekSains/gambar", depends_on: [F1], points: 4}
      - {id: mod-w02.project.K1.c07, rule: "lokasi(sains-pengukuran.csv) = /home/bima/ProyekSains/data", depends_on: [F1], points: 4}
      - {id: mod-w02.project.K1.c08, rule: "lokasi(sains-suhu.xlsx) = /home/bima/ProyekSains/data", depends_on: [F1], points: 4}
      - {id: mod-w02.project.K1.c09, rule: "lokasi(sains-kelembapan.csv) = /home/bima/ProyekSains/data", depends_on: [F1], points: 4}
      - {id: mod-w02.project.K1.c10, rule: "lokasi(X) = /home/bima/Unduhan untuk ketiga berkas lain (lagu-favorit.mp3, undangan-ulang-tahun.pdf, pemasang-game.exe)", depends_on: [F1, pohon_diubah], points: 3}
      - {id: mod-w02.project.K1.c11, rule: "F2 = lokasi(sains-laporan.docx) + '/sains-laporan.docx' (path_correct)", depends_on: [F2 bentuk absolut sah, lokasi(sains-laporan.docx) terdefinisi dan berada di dalam /home/bima/ProyekSains], points: 6}
      - {id: mod-w02.project.K1.c12, rule: "F3 = path relatif terpendek dari /home/bima/ProyekSains/gambar ke lokasi(sains-laporan.docx)/sains-laporan.docx (path_correct)", depends_on: [F3 bentuk relatif sah, folder /home/bima/ProyekSains/gambar ada di F1, lokasi(sains-laporan.docx) terdefinisi dan berada di dalam /home/bima/ProyekSains], points: 5}
      - {id: mod-w02.project.K1.c13, rule: "F4 = path relatif terpendek dari /home/bima/Unduhan ke lokasi(sains-pengukuran.csv)/sains-pengukuran.csv (path_correct)", depends_on: [F4 bentuk relatif sah, lokasi(sains-pengukuran.csv) terdefinisi dan berada di dalam /home/bima/ProyekSains], points: 5}
      - {id: mod-w02.project.K1.c14, rule: "F5 (diurai) = jumlah berkas yang berada langsung di /home/bima/ProyekSains/data pada F1", depends_on: [F5 dapat diurai, folder /home/bima/ProyekSains/data ada di F1], points: 5}
  K2:
    name: Kelengkapan deliverable
    points: 20
    definition: "MR-A (D-33): setiap deliverable ada DAN valid secara bentuk. F1 sah bila pohon memuat ≥ 1 folder baru; F2–F4 sah menurut path_form; F5 sah menurut number_rule_F5. K2 tidak menilai kebenaran nilai (K1) atau aturan struktur (K3)"
    checks:
      - {id: mod-w02.project.K2.c01, rule: "F1 memuat ≥ 1 folder yang tidak ada di keadaan awal", depends_on: [F1], points: 4}
      - {id: mod-w02.project.K2.c02, rule: "F2 terisi dan absolute_valid", depends_on: [F2], points: 4}
      - {id: mod-w02.project.K2.c03, rule: "F3 terisi dan relative_valid", depends_on: [F3], points: 4}
      - {id: mod-w02.project.K2.c04, rule: "F4 terisi dan relative_valid", depends_on: [F4], points: 4}
      - {id: mod-w02.project.K2.c05, rule: "F5 terisi dan dapat diurai menurut number_rule_F5", depends_on: [F5], points: 4}
  K3:
    name: Struktur dan format
    points: 10
    checks:
      - {id: mod-w02.project.K3.c01, rule: "Folder /home/bima/ProyekSains ada (nama persis, huruf besar/kecil dibedakan)", depends_on: [F1], points: 3}
      - {id: mod-w02.project.K3.c02, rule: "Ketiga folder /home/bima/ProyekSains/dokumen, /gambar, /data ada (nama persis, huruf kecil)", depends_on: [F1], points: 3}
      - {id: mod-w02.project.K3.c03, rule: "Tidak ada folder baru selain keempat required_folders (N4)", depends_on: [F1, pohon_diubah], points: 2}
      - {id: mod-w02.project.K3.c04, rule: "Tepat 12 berkas di luar Tempat Sampah, dengan 12 nama asli, masing-masing tepat satu (tidak ada yang dihapus, disalin, atau diganti nama; N2, N4)", depends_on: [F1, pohon_diubah], points: 2}
  K4:
    name: Penjelasan proyek (komposisi K-A, 5 × CE-S1, P = 2)
    points: 10
    note: "Soal tentang tugas proyek ini; terpisah dari komponen Concept explanation W2 (D-33 A.2a). Urutan opsi tetap; posisi kunci disebar (b, c, a, d, b)"
    items:
      - id: mod-w02.project.K4.q1
        lo: comp-w02-fs-01
        stem: "Mengapa `undangan-ulang-tahun.pdf` tetap di Unduhan walaupun berekstensi `.pdf`?"
        options: {a: "Berkas PDF tidak dapat dipindah", b: "Berkas itu bukan berkas proyek karena namanya tidak diawali `sains-`; ekstensi saja tidak menentukan", c: "PDF termasuk berkas tabel/data", d: "Ekstensinya harus diganti dulu sebelum dipindah"}
        key: b
        points: 2
        feedback: "N2 memakai dua syarat: berkas proyek (awalan sains-) lalu jenisnya (ekstensi)."
      - id: mod-w02.project.K4.q2
        lo: comp-w02-proc-01
        stem: "Saat mengerjakan proyek, aplikasi pengelola berkas macet dan kamu mengakhiri prosesnya. Apa yang terjadi pada berkas yang **sudah selesai** dipindah sebelumnya?"
        options: {a: "Kembali ke Unduhan", b: "Ikut terhapus bersama proses", c: "Tetap di lokasi barunya, karena pemindahan yang sudah selesai sudah tercatat di penyimpanan", d: "Pindah ke Tempat Sampah"}
        key: c
        points: 2
        feedback: "Mengakhiri proses hanya menghilangkan isi RAM proses itu; perubahan yang sudah selesai ditulis ke penyimpanan tetap ada."
      - id: mod-w02.project.K4.q3
        lo: comp-w02-ops-01
        stem: "Kebutuhan meminta berkas proyek **dipindah**, bukan disalin. Apa akibatnya bagi folder Unduhan?"
        options: {a: "Berkas proyek tidak lagi ada di Unduhan, sehingga tidak ada salinan ganda", b: "Unduhan tetap berisi semua 12 berkas", c: "Folder Unduhan ikut terhapus", d: "Berkas proyek masuk Tempat Sampah"}
        key: a
        points: 2
        feedback: "Pindah menghilangkan berkas dari folder asal; salin akan membuat dua salinan."
      - id: mod-w02.project.K4.q4
        lo: comp-w02-os-01
        stem: "Fungsi sistem operasi mana yang **paling** berperan saat folder dibuat dan berkas dipindah di penyimpanan?"
        options: {a: "Manajemen proses", b: "Manajemen memori", c: "Manajemen perangkat", d: "Manajemen file"}
        key: d
        points: 2
        feedback: "Menyimpan, menamai, dan menata berkas serta folder adalah manajemen file."
      - id: mod-w02.project.K4.q5
        lo: comp-w02-perm-01
        stem: "Bima ingin teman kelompoknya dapat membuka **dan** mengedit `sains-laporan.docx`, sedangkan siswa kelas lain hanya dapat membacanya. Pengaturan izin mana yang sesuai?"
        options: {a: "Semua akun: baca dan tulis", b: "Teman kelompok: baca dan tulis; siswa kelas lain: baca saja", c: "Siswa kelas lain: baca dan tulis; teman kelompok: baca saja", d: "Semua akun: tanpa izin baca"}
        key: b
        points: 2
        feedback: "Mengedit butuh izin tulis; sekadar membaca cukup izin baca (hak minimum)."

point_check: "K1 9×4 + 3 + 6 + 5 + 5 + 5 = 60; K2 5×4 = 20; K3 3+3+2+2 = 10; K4 5×2 = 10; total 100"


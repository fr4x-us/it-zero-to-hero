# W2 — bank soal penjelasan konsep (D-23; kunci tidak ditampilkan sebelum dinilai)
slot_id: mod-w02.concept.s05
competency: comp-w02-ops-01
required_concepts:
- Tempat Sampah
- pulihkan
- salin mempertahankan asal
- periksa sebelum menghapus permanen
format: CE-S3
max_points: 3
content_version: '1.0'
validation:
- CE-V1 kosong → 0 poin
- CE-V2 ID tidak dikenal → 0 poin, INVALID_ANSWER
- CE-V3 ID ganda → 0 poin, INVALID_ANSWER
- CE-V4 bentuk salah → 0 poin, INVALID_ANSWER
- CE-V5 jawaban sebagian dinilai sesuai format
- CE-V7 kunci hilang/konten rusak → EVALUATION_ERROR, bukan 0 poin
feedback_stage: Kunci dan umpan balik ditampilkan setelah attempt dinilai
variants:
- item_id: item-w02-c-s05-a
  variant_id: mod-w02.concept.s05.vA
  item_version: '3.0'
  stem: 'Simulasi pengelola berkas (bukan berkas pribadimu): `kontrak.pdf` tidak sengaja dihapus dari
    folder Dokumen. Urutkan langkah untuk mengembalikannya, lalu mengosongkan Tempat Sampah dengan aman.'
  items:
  - id: A
    text: Buka Tempat Sampah
  - id: B
    text: Pilih `kontrak.pdf` dan pulihkan
  - id: C
    text: Pastikan `kontrak.pdf` sudah kembali di Dokumen, lalu periksa seluruh sisa isi Tempat Sampah
      dan pulihkan berkas lain yang masih dibutuhkan
  - id: D
    text: Kosongkan Tempat Sampah
  display_order:
  - D
  - B
  - A
  - C
  accepted_sequences:
  - - A
    - B
    - C
    - D
  credit_rule: Skor = jumlah pasangan berurutan (x_i, x_{i+1}) yang juga berurutan di SATU urutan diterima;
    maksimum atas urutan diterima; pasangan dari urutan berbeda tidak digabung (CE-S3a–S3c)
  feedback: Berkas dipulihkan dari Tempat Sampah ke folder asalnya. Sebelum mengosongkan, seluruh sisa
    isi Tempat Sampah diperiksa dan berkas lain yang masih dibutuhkan dipulihkan, karena pengosongan menghapus
    permanen semua isinya — bukan hanya satu berkas.
- item_id: item-w02-c-s05-b
  variant_id: mod-w02.concept.s05.vB
  item_version: '2.0'
  stem: 'Simulasi pengelola berkas (bukan berkas pribadimu): kamu ingin memindahkan folder `Resep` dari
    laptop ke flashdisk dengan aman lalu mengosongkan ruang laptop. Urutkan langkahnya.'
  items:
  - id: A
    text: Salin folder `Resep` beserta isinya ke flashdisk
  - id: B
    text: 'Buka `Resep` di flashdisk: pastikan jumlah dan nama berkasnya sama dengan di laptop, lalu buka
      setiap berkas untuk memastikan isinya lengkap dan dapat dibaca'
  - id: C
    text: Hapus folder `Resep` dari laptop
  - id: D
    text: Periksa seluruh isi Tempat Sampah, pulihkan berkas lain yang masih dibutuhkan, lalu kosongkan
      Tempat Sampah
  display_order:
  - C
  - A
  - D
  - B
  accepted_sequences:
  - - A
    - B
    - C
    - D
  credit_rule: Skor = jumlah pasangan berurutan (x_i, x_{i+1}) yang juga berurutan di SATU urutan diterima;
    maksimum atas urutan diterima; pasangan dari urutan berbeda tidak digabung (CE-S3a–S3c)
  feedback: Salinan diperiksa (berkasnya ada, dapat dibuka, dan isinya lengkap) sebelum yang asli dihapus.
    Tempat Sampah dikosongkan terakhir, setelah seluruh isinya diperiksa, karena pengosongan menghapus
    permanen semua berkas di dalamnya.

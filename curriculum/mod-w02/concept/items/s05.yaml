    text: Pastikan `kontrak.pdf` sudah kembali di folder Dokumen
  - id: D
    text: Salin `kontrak.pdf` dari folder Dokumen ke flashdisk
  display_order:
  - D
  - B
  - A
  - C
  accepted_sequences:
  - - A
    - B
    - C
    - D
  - - A
    - B
    - D
    - C
  credit_rule: Skor = jumlah pasangan berurutan (x_i, x_{i+1}) yang juga berurutan di SATU urutan diterima;
    maksimum atas urutan diterima; pasangan dari urutan berbeda tidak digabung (CE-S3a–S3c)
  feedback: Berkas dipulihkan dari Tempat Sampah ke folder asalnya, lalu disalin sebagai cadangan. Memeriksa
    lokasi boleh sebelum atau sesudah menyalin (dua urutan diterima).

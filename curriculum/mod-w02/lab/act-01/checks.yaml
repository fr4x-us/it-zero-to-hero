activity_id: mod-w02.lab.act-01
name: Jenis isi yang diharapkan dari ekstensi
competencies:
- comp-w02-fs-01
max_points: 30
estimated_minutes: 25
content_version: '1.0'
xp: Tidak ada identitas XP per aktivitas; XP pada identitas komponen mod-w02.lab (D-28 XI-2)
normalization: Satu kode kategori dari {DOK, TAB, GBR, AUD, VID, ARS, PRG}; buang spasi tepi; ubah ke
  huruf besar. Tidak ada aturan angka
answer_validation: Kosong atau kode di luar himpunan → 0 untuk pemeriksaan itu (INVALID_ANSWER); pemeriksaan
  lain tetap dinilai
infrastructure: Kegagalan infrastruktur/konten → EVALUATION_ERROR, evaluasi diulang dari submission yang
  sama tanpa attempt baru (D-24 IE-2)
feedback_stage: 'Setelah aktivitas dievaluasi: benar/salah per pemeriksaan + pembahasan. W2 tidak memiliki
  test kode tersembunyi (D-36 HF-A tidak berlaku)'
runtime: Tidak memerlukan runtime Python; pemeriksaan deterministik atas jawaban terstruktur

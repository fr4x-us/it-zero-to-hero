# W2 — pemeriksaan lab (kunci; tidak ditampilkan sebelum dievaluasi)
activity_id: mod-w02.lab.act-03
name: Simulasi operasi berkas, izin, dan proses
competencies:
- comp-w02-ops-01
- comp-w02-perm-01
- comp-w02-proc-01
max_points: 40
estimated_minutes: 35
content_version: '1.0'
xp: Tidak ada identitas XP per aktivitas; XP pada identitas komponen mod-w02.lab (D-28 XI-2)
normalization: 'c01, c05: aturan path (huruf besar/kecil dibedakan; spasi tepi dibuang). c02, c03, c08:
  spasi tepi dibuang, lalu cocok persis dengan accepted_answers (digit tanpa nol di depan, tanpa tanda,
  tanpa desimal/pemisah ribuan; c02 boleh diikuti "berkas" dengan/tanpa satu spasi, huruf besar/kecil
  bebas). c04: nama berkas persis (huruf besar/kecil dibedakan). c06: satu nama akun dari pilihan. c07:
  satu huruf opsi {a, b, c, d}'
answer_validation: Kosong, bentuk ditolak, atau di luar pilihan → 0 untuk pemeriksaan itu; pemeriksaan
  lain tetap dinilai
infrastructure: Kegagalan infrastruktur/konten → EVALUATION_ERROR, evaluasi diulang dari submission yang
  sama tanpa attempt baru (D-24 IE-2)
feedback_stage: 'Setelah aktivitas dievaluasi: benar/salah per pemeriksaan + pembahasan. W2 tidak memiliki
  test kode tersembunyi (D-36 HF-A tidak berlaku)'
runtime: Tidak memerlukan runtime Python; pemeriksaan deterministik atas jawaban terstruktur

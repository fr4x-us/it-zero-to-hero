- item_id: item-w05-t-s13-a
  variant_id: mod-w05.theory.s13.vA
  item_version: '1.0'
  stem: Model ideal (aliran tetap). Keran mengalirkan **250 mL per detik**. Berapa **menit** untuk mengisi
    bak **90 liter** (1 liter = 1.000 mL)?
  accepted_answers:
  - '6'
  - 6 menit
  - 6menit
  normalization: 'Buang spasi/tab di awal dan akhir; cocokkan persis dengan salah satu accepted_answers.
    Aturan angka NB-5: bilangan bulat tanpa nol di depan; pemisah desimal hanya koma (`12,5`) dengan tepat
    sebanyak angka desimal yang diminta; titik hanya sebagai pemisah ribuan dengan kelompok tepat tiga
    digit (`1.250`); tanda minus `-` atau `−` hanya untuk bilangan negatif; satuan yang disebut di soal
    boleh ditulis setelah angka dengan/tanpa satu spasi (huruf besar/kecil satuan bebas); untuk rupiah
    boleh diawali `Rp` dengan/tanpa spasi. Ditolak: titik sebagai desimal (`12.5`), nol di depan, pecahan
    (`1/2`), kata, satuan lain, angka desimal lebih/kurang dari yang diminta'
  explanation: 90 liter = 90.000 mL; 90.000 ÷ 250 = 360 detik; 360 ÷ 60 = 6 menit.

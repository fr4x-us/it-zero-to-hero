  K4:
    name: Penjelasan proyek (komposisi K-A, 5 × CE-S1, P = 2)
    points: 10
    note: 'Soal tentang tugas proyek ini; terpisah dari komponen Concept explanation W5 (D-33 A.2a). Posisi
      kunci: b, d, a, c, b'
    items:
    - id: mod-w05.project.K4.q1
      lo: comp-w05-pct-01
      stem: Pada F5, persentase setiap barang dihitung terhadap …
      options:
        a: Anggaran Rp500.000
        b: Total belanja (F2), karena yang ditanyakan bagian setiap barang dari belanja
        c: Sisa anggaran (F3)
        d: Harga satuan barang itu
      key: b
      points: 2
      feedback: Nilai dasar F5 adalah total belanja; F4 yang memakai anggaran sebagai nilai dasar.
    - id: mod-w05.project.K4.q2
      lo: comp-w05-round-01
      stem: Mengapa jumlah lima persentase F5 yang sudah dibulatkan **boleh saja** tidak tepat 100,0 pada
        data lain?
      options:
        a: Karena persentase selalu salah
        b: Karena total belanja dihitung keliru
        c: Karena pembulatan ke atas wajib dipakai
        d: Karena setiap persentase dibulatkan sendiri-sendiri, sehingga selisih kecil pembulatannya dapat
          terkumpul
      key: d
      points: 2
      feedback: Pembulatan terpisah dapat membuat jumlahnya 99,9 atau 100,1; pada data proyek ini kebetulan
        tepat 100,0.
    - id: mod-w05.project.K4.q3
      lo: comp-w05-divmod-01
      stem: F6 (perjalanan tambahan maksimal) memakai …
      options:
        a: Hasil bagi sisa anggaran oleh harga perjalanan, karena perjalanan hanya dapat dibayar utuh
        b: Hasil bagi yang dibulatkan ke atas
        c: Sisa pembagian
        d: Persentase sisa anggaran
      key: a
      points: 2
      feedback: Hanya perjalanan yang dapat dibayar penuh yang dihitung; sisa uangnya menjadi F7.
    - id: mod-w05.project.K4.q4
      lo: comp-w05-expr-01
      stem: Rumus subtotal yang sesuai untuk setiap baris adalah …
      options:
        a: subtotal = jumlah + harga satuan
        b: subtotal = harga satuan ÷ jumlah
        c: subtotal = jumlah × harga satuan × (100 − diskon%) ÷ 100
        d: subtotal = (jumlah × harga satuan) − diskon%
      key: c
      points: 2
      feedback: Diskon adalah persen dari nilai baris; tanpa diskon, (100 − 0) ÷ 100 = 1.
    - id: mod-w05.project.K4.q5
      lo: comp-w05-unit-01
      stem: Mengapa F4 (persen anggaran terpakai) dihitung F2 ÷ anggaran × 100%, bukan F3 ÷ anggaran?
      options:
        a: Keduanya sama saja
        b: F2 adalah uang yang sudah dipakai, sedangkan F3 adalah yang belum dipakai
        c: Karena F3 selalu nol
        d: Karena anggaran harus dikali 100 dulu
      key: b
      points: 2
      feedback: F3 ÷ anggaran memberi persen yang **belum** terpakai (55,6%).

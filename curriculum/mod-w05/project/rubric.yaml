field_rules:
  rupiah_readable: 'NB-5 bilangan bulat tidak negatif: digit tanpa nol di depan, atau dengan titik ribuan
    berkelompok tepat tiga digit; boleh diawali `Rp` dengan/tanpa spasi; spasi tepi dibuang. Diterima:
    `40000`, `40.000`, `Rp40.000`, `Rp 40000`. Tidak terbaca: `40,000`, `40.000,00`, `40rb`, `040000`,
    kata. Akhiran kata/simbol satuan dibaca tanpa membedakan huruf besar/kecil (mis. `PERSEN`, `Kali`);
    awalan `Rp` ditulis persis (kontrak NB-5 N3–N4).'
  percent_readable: 'NB-5 bilangan tidak negatif dengan 0 atau 1 angka di belakang koma; boleh diikuti
    `%` atau `persen` dengan/tanpa spasi. Diterima: `44,4`, `44,4%`, `44`. Tidak terbaca: `44.4` (titik
    bukan desimal), `44,40` (lebih dari satu angka desimal), kata. Akhiran kata/simbol satuan dibaca tanpa
    membedakan huruf besar/kecil (mis. `PERSEN`, `Kali`); awalan `Rp` ditulis persis (kontrak NB-5 N3–N4).'
  count_readable: 'NB-5 bilangan bulat tidak negatif tanpa nol di depan; boleh diikuti `kali` dengan/tanpa
    spasi. Tidak terbaca: desimal (`39,7`), kata. Akhiran kata/simbol satuan dibaca tanpa membedakan huruf
    besar/kecil (mis. `PERSEN`, `Kali`); awalan `Rp` ditulis persis (kontrak NB-5 N3–N4).'
  value_compare: 'Nilai terbaca dibandingkan PERSIS dengan konstanta key (bilangan rasional; `44` ≠ `44,4`).
    Tidak ada kredit kesalahan berantai: setiap isian dibandingkan dengan nilai benar dari data proyek,
    bukan dengan isian pelajar lain (kredit independen MR-2)'
  rupiah_strict: 'K3: bilangan bulat dengan titik ribuan berkelompok tepat tiga digit (`40.000`, `5.000`),
    tanpa `Rp`'
  percent_strict: 'K3: tepat satu angka di belakang koma, tanpa `%` atau kata (`18,0`)'
  count_strict: 'K3: digit saja, tanpa kata satuan'
  validity: Isian kosong atau tidak terbaca → INVALID_ANSWER untuk isian itu saja; pemeriksaan yang depends_on
    isian itu bernilai 0; isian lain tetap dinilai. ID baris tidak dikenal (selain P1–P5) diabaikan; baris
    P1–P5 yang hilang = kosong. Struktur luar rusak (F1 atau F5 bukan tabel P1–P5) → seluruh isian itu
    tidak terbaca. Kegagalan aplikasi/konten → EVALUATION_ERROR (D-24 IE-2), bukan skor 0
  dependency_rule: 'MR-2: pemeriksaan bernilai 0 bila isian yang dibutuhkannya kosong atau tidak terbaca;
    tanpa gerbang nol global. Formulir tanpa isian sama sekali = 0 untuk K1–K3 (MR-6)'

  - id: b
    text: Dalam `y = 2 × x`, bila `x = 5` maka `y = 10`
  - id: c
    text: '`3²` sama dengan `3 × 2`'
  - id: d
    text: Rata-rata = jumlah semua nilai dibagi banyaknya nilai
  - id: e
    text: Huruf dalam rumus selalu bernilai 0
  key:

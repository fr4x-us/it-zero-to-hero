learning_objectives:
  - id: LO1
    competency: comp-w05-arith-01
    text: "Menghitung ekspresi dengan urutan operasi yang benar (kurung, pangkat, kali/bagi kiri ke kanan, tambah/kurang kiri ke kanan), termasuk bilangan negatif"
  - id: LO2
    competency: comp-w05-expr-01
    text: "Menjelaskan variabel, ekspresi, dan rumus; mensubstitusi nilai; menghitung pangkat dan rata-rata"
  - id: LO3
    competency: comp-w05-divmod-01
    text: "Menentukan hasil bagi dan sisa pembagian bilangan bulat serta memakainya untuk keterbagian, siklus hari, dan pengelompokan"
  - id: LO4
    competency: comp-w05-unit-01
    text: "Mengonversi satuan waktu, massa, dan volume, serta memakai perbandingan senilai"
  - id: LO5
    competency: comp-w05-pct-01
    text: "Menghitung persentase dari nilai dasar yang benar, diskon, persen kenaikan/penurunan, dan nilai awal"
  - id: LO6
    competency: comp-w05-round-01
    text: "Membulatkan bilangan desimal menurut aturan yang ditentukan dan memilih pembulatan ke atas atau ke bawah sesuai kebutuhan"


# W6 — rubrik mini-project (MR-A, D-33). Kunci, contoh jawaban, dan contoh evaluasi
# hanya untuk reviewer/penilai; tidak ditampilkan kepada pelajar sebelum dinilai.
component: mod-w06.project
content_version: '1.0'
max_points: 100
constants:
  variables:
    P: pintu terbuka (1) / tertutup (0)
    J: jendela terbuka (1) / tertutup (0)
    M: mode malam aktif (1) / tidak (0)
  row_order: Baris 1–8 = kombinasi P J M dari 000 sampai 111 (P bit paling kiri)
  rules:
    alarm: Alarm berbunyi bila mode malam aktif DAN (pintu terbuka ATAU jendela terbuka)
    yellow: Lampu kuning menyala bila mode malam TIDAK aktif DAN (pintu terbuka ATAU jendela terbuka)
  key:
    F1:
      R1: 0
      R2: 0
      R3: 0
      R4: 1
      R5: 0
      R6: 1
      R7: 0
      R8: 1
    F2_reference: M AND (P OR J)
    F2_truth_table:
    - 0
    - 0
    - 0
    - 1
    - 0
    - 1
    - 0
    - 1
    F3: 3
    F4_reference: NOT M AND (P OR J)
    F4_truth_table:
    - 0
    - 0
    - 1
    - 0
    - 1
    - 0
    - 1
    - 0
    F5: 6
field_rules:
  cell_readable: Satu digit `0` atau `1` setelah spasi tepi dibuang; selain itu (kata, `true`, kosong)
    → sel itu tidak terbaca
  expression_readable: 'Tata bahasa BX (W6): ekspresi memakai variabel yang disebut di soal, kata kunci
    `AND`, `OR`, `NOT`, dan kurung `( )`; token dipisahkan spasi (kurung boleh menempel). Prioritas: `NOT`
    lebih dulu, lalu `AND`, lalu `OR`; operator setara dikerjakan dari kiri ke kanan; kurung mengubah
    urutan. Kurung harus berpasangan. Token lain (mis. `&&`, `||`, `!`, `+`, `*`, `xor`, variabel yang
    tidak disebut) membuat ekspresi tidak terbaca (INVALID_ANSWER). Variabel yang sah hanya P, J, M; kata
    kunci dan variabel boleh huruf kecil (dibaca seperti huruf besar)'
  expression_strict: 'K3: kata kunci ditulis huruf besar persis (`AND`, `OR`, `NOT`) dan variabel huruf
    besar persis (`P`, `J`, `M`)'
  equivalence: Ekspresi terbaca dievaluasi pada kedelapan kombinasi P, J, M; benar bila sama dengan truth_table
    kunci di SEMUA baris (ekspresi ekuivalen apa pun diterima)
  count_readable: 'NB-5 bilangan bulat tidak negatif tanpa nol di depan; F3 boleh diikuti kata `baris`
    dengan/tanpa spasi. Tidak terbaca: desimal, kata, bilangan biner yang diberi awalan'
  count_strict: 'K3: digit saja tanpa kata'
  validity: 'Isian kosong/tidak terbaca → INVALID_ANSWER untuk isian itu saja; pemeriksaan yang depends_on
    isian itu bernilai 0; isian lain tetap dinilai. F1: baris R1–R8 yang hilang = sel kosong; ID baris
    tak dikenal diabaikan; struktur luar rusak (F1 bukan tabel baris) → seluruh F1 tidak terbaca. Kegagalan
    aplikasi/konten → EVALUATION_ERROR (D-24 IE-2), bukan skor 0'
  value_compare: 'F1 dan F3 dibandingkan dengan konstanta kunci yang diturunkan dari aturan (bukan dari
    ekspresi pelajar): kredit independen MR-2'
  dependency_rule: 'MR-2: pemeriksaan bernilai 0 bila isian yang dibutuhkannya kosong atau tidak terbaca;
    tanpa gerbang nol global. Formulir tanpa isian sama sekali = 0 untuk K1–K3 (MR-6)'

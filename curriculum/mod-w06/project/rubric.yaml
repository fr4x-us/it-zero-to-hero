  functions: F1, F3, F5 tunggal; F2 dan F4 masing-masing tepat satu fungsi Boolean (tabel kunci), dengan
    tak hingga banyak penulisan ekuivalen yang semuanya diterima. Banyak tabel F1 bernilai penuh = 1 dari
    2⁸ = 256 kemungkinan
  reference_strict:
    F1:
      R1: '0'
      R2: '0'
      R3: '0'
      R4: '1'
      R5: '0'
      R6: '1'
      R7: '0'
      R8: '1'
    F2: M AND (P OR J)
    F3: '3'
    F4: NOT M AND (P OR J)
    F5: '6'

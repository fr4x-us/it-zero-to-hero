  K4:
    name: Penjelasan proyek (komposisi K-A, 5 × CE-S1, P = 2)
    points: 10
    note: 'Soal tentang tugas proyek ini; terpisah dari komponen Concept explanation W6 (D-33 A.2a). Posisi
      kunci: c, a, d, b, a'
    items:
    - id: mod-w06.project.K4.q1
      lo: comp-w06-table-01
      stem: Mengapa tabel F1 memiliki tepat 8 baris?
      options:
        a: Karena alarm punya 8 bagian
        b: Karena 8 adalah satu byte
        c: 'Karena ada 3 input dan setiap input 2 nilai: 2³ = 8 kombinasi'
        d: Karena aturan memakai 8 kata
      key: c
      points: 2
      feedback: Tabel lengkap memuat setiap kombinasi input tepat sekali.
    - id: mod-w06.project.K4.q2
      lo: comp-w06-model-01
      stem: Pada aturan alarm, mengapa `P OR J` ditulis di dalam kurung?
      options:
        a: Karena "pintu atau jendela" adalah satu syarat yang harus dihitung dulu sebelum digabung dengan
          mode malam memakai AND
        b: Karena kurung membuat ekspresi lebih panjang
        c: Karena OR selalu dikerjakan lebih dulu
        d: Kurung tidak berpengaruh
      key: a
      points: 2
      feedback: 'Tanpa kurung, `M AND P OR J` dibaca `(M AND P) OR J`: jendela terbuka saja sudah membunyikan
        alarm di siang hari.'
    - id: mod-w06.project.K4.q3
      lo: comp-w06-repr-01
      stem: Pada F5, `110` adalah …
      options:
        a: Nilai Boolean benar
        b: Bilangan seratus sepuluh
        c: Tiga nilai Boolean yang dijumlahkan
        d: Kode biner P J M yang bernilai 6 dalam desimal
      key: d
      points: 2
      feedback: Deretan bit P J M dibaca sebagai bilangan biner 110₂ = 4 + 2 = 6; setiap bit sendiri adalah
        nilai Boolean satu input.
    - id: mod-w06.project.K4.q4
      lo: comp-w06-ops-01
      stem: Mengapa lampu kuning memakai `NOT M`?
      options:
        a: Karena NOT membuat lampu lebih terang
        b: Karena lampu kuning hanya untuk saat mode malam tidak aktif; NOT M bernilai 1 tepat saat M
          = 0
        c: Karena M selalu 0
        d: Karena NOT sama dengan OR
      key: b
      points: 2
      feedback: NOT membalik nilai M.
    - id: mod-w06.project.K4.q5
      lo: comp-w06-table-01
      stem: Bagaimana memastikan dua ekspresi berbeda untuk alarm sama-sama benar?
      options:
        a: Bandingkan hasilnya pada kedelapan baris tabel kebenaran; harus sama di semua baris
        b: Bandingkan panjang tulisannya
        c: Cukup coba satu baris
        d: Hitung banyak kata AND
      key: a
      points: 2
      feedback: Ekuivalen berarti sama di semua kombinasi input.
point_check: K1 8×3 + 12 + 6 + 12 + 6 = 60; K2 6+5+2+5+2 = 20; K3 4+3+3 = 10; K4 5×2 = 10; total 100

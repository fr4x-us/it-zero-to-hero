# W6 — pemeriksaan lab (kunci; tidak ditampilkan sebelum dievaluasi)
activity_id: mod-w06.lab.act-02
name: Tabel kebenaran
competencies:
- comp-w06-ops-01
- comp-w06-table-01
max_points: 30
estimated_minutes: 40
content_version: '1.0'
xp: Tidak ada identitas XP per aktivitas; XP pada identitas komponen mod-w06.lab (D-28 XI-2)
normalization: 'c01–c04, c06: Nilai Boolean: satu digit 0 atau 1; kata (benar/true) ditolak. c05: Desimal:
  Buang spasi/tab di awal dan akhir; cocokkan persis dengan salah satu accepted_answers. Aturan angka
  NB-5: bilangan bulat tanpa nol di depan; pemisah desimal hanya koma (`12,5`) dengan tepat sebanyak angka
  desimal yang diminta; titik hanya sebagai pemisah ribuan dengan kelompok tepat tiga digit (`1.250`);
  tanda minus `-` atau `−` hanya untuk bilangan negatif; satuan yang disebut di soal boleh ditulis setelah
  angka dengan/tanpa satu spasi (huruf besar/kecil satuan bebas); untuk rupiah boleh diawali `Rp` dengan/tanpa
  spasi. Ditolak: titik sebagai desimal (`12.5`), nol di depan, pecahan (`1/2`), kata, satuan lain, angka
  desimal lebih/kurang dari yang diminta (boleh diikuti kata `baris`)'
answer_validation: Kosong atau bentuk ditolak → 0 untuk pemeriksaan itu (INVALID_ANSWER bila bentuk tidak
  sah); pemeriksaan lain tetap dinilai (kredit independen)
infrastructure: Kegagalan infrastruktur/konten → EVALUATION_ERROR, evaluasi diulang dari submission yang
  sama tanpa attempt baru (D-24 IE-2); bukan skor 0
feedback_stage: 'Setelah aktivitas dievaluasi: benar/salah per pemeriksaan + pembahasan. W6 tidak memiliki
  test kode tersembunyi (D-36 HF-A tidak berlaku)'
runtime: 'Tidak memerlukan runtime Python; pemeriksa deterministik per jenis (EB-4, D-24): konversi biner
  dan nilai Boolean'

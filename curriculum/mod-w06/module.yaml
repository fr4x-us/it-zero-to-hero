title: "Biner dan Logika Boolean"
locked_scope: "W6 biner dan logika Boolean (B01 M-02, D-01 M-02; CUR §2 baris 6: konversi basis; tabel kebenaran; lab konversi biner dan evaluator ekspresi Boolean)"

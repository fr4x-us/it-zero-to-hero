audience: "Pemula total tanpa pengalaman IT atau pemrograman; telah menyelesaikan W1–W5"
prerequisites: [mod-w05]
nominal_minutes: 480
objective_source: "Topik dan tujuan ringkas CUR §2 baris 6 (kerangka D-01 M-02). Rumusan LO rinci disusun penyusun mengikuti pola W1–W5 (CU-1 tetap PROPOSED) — bukan keputusan owner baru"
number_rules: "BN-6: biner hanya 0/1, tanpa awalan/subskrip; panjang sesuai instruksi (tanpa nol di depan: 0 ditulis `0`, bilangan positif diawali 1; tepat n bit: tepat n digit dengan nol pengisi); semua bilangan tak bertanda (tanpa bilangan negatif, overflow, atau lebar bit di luar soal). Desimal mengikuti NB-5 (W5). Nilai Boolean 1 = benar, 0 = salah — bukan bilangan"
expression_grammar: "BX (Pelajaran 3 §3): variabel yang disebut soal, AND/OR/NOT, kurung; prioritas NOT → AND → OR; NOT satu operand dan boleh berulang (NOT NOT X = X), AND/OR dua operand; tata bahasa formal di project/rubric.yaml expression_readable; operator lain di luar cakupan W6. Format jawaban konten di bawah EB-4 (D-24), bukan kebijakan baru"
python_dependency: "Tidak ada. AND/OR/NOT ditulis sebagai kata logika, bukan sintaks bahasa pemrograman (W9+)"

learning_objectives:
  - id: LO1
    competency: comp-w06-repr-01
    text: "Menjelaskan bit, basis 2, bobot posisi, dan membedakan bilangan biner, bilangan desimal, dan nilai Boolean"
  - id: LO2
    competency: comp-w06-bin2dec-01
    text: "Mengubah bilangan biner tak bertanda (termasuk 8 bit dengan nol di depan) ke desimal memakai bobot posisi"
  - id: LO3
    competency: comp-w06-dec2bin-01
    text: "Mengubah desimal ke biner tanpa nol di depan atau tepat n bit, dan menentukan rentang nilai n bit tak bertanda"
  - id: LO4
    competency: comp-w06-ops-01
    text: "Menjelaskan dan menerapkan operator AND, OR, dan NOT"
  - id: LO5
    competency: comp-w06-table-01
    text: "Menyusun tabel kebenaran lengkap dan mengevaluasi ekspresi dengan kurung dan prioritas NOT → AND → OR"
  - id: LO6
    competency: comp-w06-model-01
    text: "Mengubah aturan sehari-hari menjadi ekspresi Boolean dan memeriksa ekuivalensi dengan tabel kebenaran"


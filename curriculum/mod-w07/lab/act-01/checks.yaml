# W7 — pemeriksaan lab (kunci; tidak ditampilkan sebelum dievaluasi)
activity_id: mod-w07.lab.act-01
name: Dekomposisi dan urutan tugas
competencies:
- comp-w07-decomp-01
- comp-w07-order-01
max_points: 30
estimated_minutes: 40
content_version: '1.0'
xp: Tidak ada identitas XP per aktivitas; XP pada identitas komponen mod-w07.lab (D-28 XI-2)
normalization: 'c01–c03: Kode kelompok: satu huruf dari daftar kode; huruf besar/kecil bebas. c04: Urutan:
  ID tugas dipisah spasi atau koma; huruf besar/kecil bebas; setiap ID tepat sekali. Dinormalisasi (huruf
  besar, dipisah satu spasi) lalu dicocokkan dengan SALAH SATU urutan valid di accepted_answers (semua
  urutan valid dienumerasi). ID tak dikenal, ganda, atau hilang → INVALID_ANSWER. c05: Buang spasi/tab
  di awal dan akhir; cocokkan persis dengan salah satu accepted_answers. Aturan angka NB-5: bilangan bulat
  tanpa nol di depan; pemisah desimal hanya koma (`12,5`) dengan tepat sebanyak angka desimal yang diminta;
  titik hanya sebagai pemisah ribuan dengan kelompok tepat tiga digit (`1.250`); tanda minus `-` atau
  `−` hanya untuk bilangan negatif; satuan yang disebut di soal boleh ditulis setelah angka dengan/tanpa
  satu spasi (huruf besar/kecil satuan bebas); untuk rupiah boleh diawali `Rp` dengan/tanpa spasi. Ditolak:
  titik sebagai desimal (`12.5`), nol di depan, pecahan (`1/2`), kata, satuan lain, angka desimal lebih/kurang
  dari yang diminta (boleh diikuti kata `urutan`). c06: Pilihan: satu huruf a–d, huruf besar/kecil bebas'
answer_validation: Kosong atau bentuk ditolak → 0 untuk pemeriksaan itu (INVALID_ANSWER bila bentuk tidak
  sah); pemeriksaan lain tetap dinilai (kredit independen)
infrastructure: Kegagalan infrastruktur/konten → EVALUATION_ERROR, evaluasi diulang dari submission yang
  sama tanpa attempt baru (D-24 IE-2); bukan skor 0
feedback_stage: 'Setelah aktivitas dievaluasi: benar/salah per pemeriksaan + pembahasan. W7 tidak memiliki
  test kode tersembunyi (D-36 HF-A tidak berlaku)'
runtime: Tidak memerlukan runtime Python; pemeriksaan deterministik atas kode, urutan, angka, dan pilihan
variants:
- variant_id: mod-w07.lab.act-01.vA
  fixture:
    groups:
      K: Koordinasi — menghasilkan kesepakatan kelompok
      I: Isi — menghasilkan teks atau foto
      T: Tampilan — menghasilkan papan yang tertata
    tasks:
      M1: 'Rapat pembagian tugas (hasil: daftar siapa mengerjakan apa)'
      M2: 'Menulis artikel kegiatan (hasil: teks artikel)'
      M3: 'Memilih foto kegiatan (hasil: 4 foto terpilih)'
      M4: 'Mendesain tata letak papan (hasil: sketsa posisi artikel dan foto)'
      M5: 'Menempel artikel dan foto di papan sesuai sketsa (hasil: mading jadi)'
    prerequisites:
    - M1 sebelum M2
    - M1 sebelum M3
    - M2 sebelum M4
    - M3 sebelum M4
    - M4 sebelum M5
  visible_example:
    note: 'Contoh terlihat (0 poin): tugas "membeli spidol (hasil: spidol)" untuk proyek lain → kelompok
      Barang'
  visibility: spec.md = terlihat pelajar sebelum dinilai (fixture dalam urutan tampil); berkas ini = khusus
    penilai sebelum dinilai; feedback = setelah dinilai (CB-0 §1a)
  checks:
  - check_id: mod-w07.lab.act-01.vA.c01

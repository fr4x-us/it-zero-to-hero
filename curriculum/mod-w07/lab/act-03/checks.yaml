  - check_id: mod-w07.lab.act-03.vB.c04
    name: Hasil yang diharapkan
    question: Untuk kasus uji x = 2, y = 9, berapa hasil yang **diharapkan** (benar)?
    accepted_answers:
    - '7'
    points: 5

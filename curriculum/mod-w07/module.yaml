learning_objectives:
  - id: LO1
    competency: comp-w07-decomp-01
    text: "Memecah masalah menjadi sub-masalah yang lengkap, tidak tumpang-tindih, dan dapat dikerjakan sendiri"
  - id: LO2
    competency: comp-w07-pattern-01
    text: "Menemukan pola bertambah/berkurang tetap, berlipat, berulang, dan pola gambar; menghitung suku ke-n"
  - id: LO3
    competency: comp-w07-abstract-01
    text: "Memilih informasi yang relevan untuk tujuan tertentu dan menggeneralisasi perhitungan khusus menjadi rumus bervariabel"
  - id: LO4
    competency: comp-w07-algo-01
    text: "Menulis dan menelusuri langkah yang jelas, terukur, berurutan, dan berakhir"
  - id: LO5
    competency: comp-w07-order-01
    text: "Menyusun urutan tugas yang memenuhi prasyarat, menghitung banyak urutan valid, dan menemukan tugas yang dapat dikerjakan bersamaan"
  - id: LO6
    competency: comp-w07-test-01
    text: "Memakai kasus uji (masukan + hasil yang diharapkan), termasuk kasus batas, untuk mengungkap kesalahan langkah"


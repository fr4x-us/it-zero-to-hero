      points: 5
  K2:
    name: Kelengkapan deliverable
    points: 20
    definition: 'MR-A (D-33): deliverable ada DAN terbaca; kebenaran di K1'
    checks:
    - id: mod-w07.project.K2.c01
      rule: Kedelapan kode F1 terbaca
      depends_on:
      - F1
      points: 5
    - id: mod-w07.project.K2.c02
      rule: F2 terbaca (permutasi T1–T8)
      depends_on:
      - F2
      points: 5
    - id: mod-w07.project.K2.c03
      rule: F3 terbaca
      depends_on:
      - F3
      points: 2
    - id: mod-w07.project.K2.c04
      rule: F4 terbaca dan tidak kosong
      depends_on:
      - F4
      points: 4
    - id: mod-w07.project.K2.c05
      rule: F5 terbaca
      depends_on:
      - F5
      points: 2
    - id: mod-w07.project.K2.c06
      rule: F6 terbaca
      depends_on:
      - F6
      points: 2
  K3:
    name: Struktur dan format
    points: 10
    checks:
    - id: mod-w07.project.K3.c01
      rule: F5 dan F6 terbaca DAN number_strict
      depends_on:
      - F5
      - F6
      points: 4
    - id: mod-w07.project.K3.c02
      rule: F3 terbaca DAN number_strict
      depends_on:
      - F3
      points: 3
    - id: mod-w07.project.K3.c03
      rule: Kedelapan kode F1 terbaca DAN code_strict
      depends_on:
      - F1
      points: 3
  K4:
    name: Penjelasan proyek (komposisi K-A, 5 × CE-S1, P = 2)
    points: 10
    note: 'Soal tentang tugas proyek ini; terpisah dari komponen Concept explanation W7 (D-33 A.2a). Posisi
      kunci: d, b, a, c, b'
    items:
    - id: mod-w07.project.K4.q1
      lo: comp-w07-decomp-01
      stem: Mengapa T2 dan T5 masuk kelompok yang sama?
      options:
        a: Karena dikerjakan pada hari yang sama
        b: Karena namanya diawali huruf yang sama
        c: Karena keduanya paling lama
        d: Karena keduanya menghasilkan bahan dari sumber bacaan
      key: d
      points: 2
      feedback: Kelompok ditentukan oleh hasil tugas.
    - id: mod-w07.project.K4.q2
      lo: comp-w07-order-01
      stem: Mengapa ada lebih dari satu urutan valid untuk F2?
      options:
        a: Karena prasyarat boleh dilanggar
        b: Karena tugas riset bacaan dan tugas data tidak saling membutuhkan, sehingga dapat diselang-seling
        c: Karena semua tugas bebas urutannya
        d: Karena T7 boleh dikerjakan pertama
      key: b
      points: 2
      feedback: Rantai T2→T5 dan T3→T4 dapat digabung dengan berbagai cara (6 urutan).
    - id: mod-w07.project.K4.q3
      lo: comp-w07-abstract-01
      stem: Mengapa warna latar slide (I5) tidak dipilih di F4?
      options:
        a: Karena tidak mengubah kapan atau dalam urutan apa tugas dikerjakan
        b: Karena slide tidak penting
        c: Karena Dina tidak suka warna
        d: Karena warna selalu sama
      key: a
      points: 2
      feedback: 'Abstraksi: informasi dipilih menurut tujuan (menyusun jadwal).'
    - id: mod-w07.project.K4.q4
      lo: comp-w07-pattern-01
      stem: F3 memakai pola …
      options:
        a: Berlipat dua
        b: Berulang setiap tiga hari
        c: Bertambah tetap 3 setiap hari
        d: Acak
      key: c
      points: 2
      feedback: '12, 15, 18 bertambah 3; hari ke-6: 12 + 3 × 5.'
    - id: mod-w07.project.K4.q5
      lo: comp-w07-test-01
      stem: Cara paling tepat memeriksa bahwa urutan F2 benar adalah …
      options:
        a: Memastikan T1 di awal saja
        b: 'Memeriksa setiap prasyarat satu per satu: tugas yang dibutuhkan selalu muncul lebih dulu'
        c: Membandingkan dengan urutan teman
        d: Menghitung banyak tugas
      key: b
      points: 2
      feedback: Setiap prasyarat adalah satu "kasus uji" untuk urutanmu.

# W7 — rubrik mini-project (MR-A, D-33). Kunci, contoh jawaban, dan contoh evaluasi
# hanya untuk reviewer/penilai; tidak ditampilkan kepada pelajar sebelum dinilai.
component: mod-w07.project
content_version: '1.0'
max_points: 100
constants:
  groups:
    K: Koordinasi — menghasilkan kesepakatan atau pembagian kerja kelompok
    R: Riset bacaan — menghasilkan bahan dari sumber bacaan topik (buku, artikel)
    D: Data — menghasilkan data pengamatan atau olahannya
    P: Presentasi — menghasilkan atau menyampaikan presentasi
  tasks:
    T1:
      text: Rapat kelompok membahas panduan tugas dari guru
      output: kesepakatan kelompok tentang kriteria penilaian
      minutes: 20
    T2:
      text: Mencari tiga sumber bacaan di perpustakaan
      output: tiga sumber bacaan
      minutes: 60
    T3:
      text: Mencatat jumlah botol plastik di kantin selama tiga hari
      output: tabel data tiga hari
      minutes: 45
    T4:
      text: Membuat grafik dari tabel data
      output: grafik batang
      minutes: 30
    T5:
      text: Menulis ringkasan dari sumber bacaan
      output: ringkasan satu halaman
      minutes: 40
    T6:
      text: Menyusun slide presentasi
      output: slide presentasi
      minutes: 50
    T7:
      text: Berlatih presentasi
      output: presentasi siap ditampilkan
      minutes: 35
    T8:
      text: Membagi tugas antaranggota
      output: daftar siapa mengerjakan apa
      minutes: 20
  prerequisites:
  - T1 sebelum T8
  - T8 sebelum T2
  - T8 sebelum T3
  - T2 sebelum T5
  - T3 sebelum T4
  - T4 sebelum T6
  - T5 sebelum T6
  - T6 sebelum T7
  info_items:
    I1: 'Tenggat presentasi: hari Jumat'
    I2: Perkiraan lama setiap tugas
    I3: Prasyarat antartugas
    I4: 'Waktu belajar yang tersedia setiap hari: 70 menit'
    I5: Warna latar slide yang disukai Dina
    I6: Nama kucing peliharaan Dina
    I7: Merek laptop kelompok
  relevance_rule: Informasi relevan = informasi yang dapat mengubah KAPAN atau DALAM URUTAN APA tugas
    dikerjakan
  daily_minutes: 70
  pattern_data: 'Botol plastik hari 1–3: 12, 15, 18 (bertambah tetap)'
  key:
    F1:
      T1: K
      T2: R
      T3: D
      T4: D
      T5: R
      T6: P
      T7: P
      T8: K
    F2_valid_orders:
    - T1 T8 T2 T3 T4 T5 T6 T7
    - T1 T8 T2 T3 T5 T4 T6 T7
    - T1 T8 T2 T5 T3 T4 T6 T7
    - T1 T8 T3 T2 T4 T5 T6 T7
    - T1 T8 T3 T2 T5 T4 T6 T7
    - T1 T8 T3 T4 T2 T5 T6 T7
    F3: 27
    F4:
    - I1
    - I2
    - I3
    - I4
    F5: 300
    F6: 5
field_rules:
  code_readable: Satu huruf dari {K, R, D, P}, spasi tepi dibuang, huruf besar/kecil bebas; selain itu
    sel tidak terbaca
  code_strict: 'K3: huruf besar persis'
  order_readable: Delapan ID T1–T8 dipisah spasi atau koma, huruf besar/kecil bebas, setiap ID tepat sekali;
    ID hilang, ganda, atau tak dikenal → F2 tidak terbaca (INVALID_ANSWER)
  order_valid: F2 terbaca DAN memenuhi SEMUA prasyarat; setiap urutan valid diterima (6 urutan valid,
    dienumerasi di key)
  info_readable: Himpunan ID dari I1–I7 tanpa ganda (boleh kosong dianggap tidak terisi); ID tak dikenal
    atau ganda → F4 tidak terbaca
  info_score: 'K1.c11: max(0, banyak ID relevan terpilih − banyak ID tidak relevan terpilih) × 2; maksimum
    8 hanya bila himpunan tepat sama dengan kunci (pola CE-S2, tidak pernah negatif)'
  number_readable: NB-5 bilangan bulat tidak negatif tanpa nol di depan; F5 boleh diikuti `menit`, F6
    boleh diikuti `hari`, F3 boleh diikuti `botol` (dengan/tanpa spasi)
  number_strict: 'K3: digit saja'
  validity: 'Isian kosong/tidak terbaca → INVALID_ANSWER untuk isian itu saja; pemeriksaan yang depends_on
    isian itu bernilai 0; isian lain tetap dinilai. F1: ID tugas tak dikenal diabaikan; tugas yang hilang
    = sel kosong; struktur luar rusak (F1 bukan tabel tugas) → seluruh F1 tidak terbaca. Kegagalan aplikasi/konten
    → EVALUATION_ERROR (D-24 IE-2), bukan skor 0'
  value_compare: Setiap isian dibandingkan dengan kunci yang diturunkan dari data proyek, bukan dari isian
    lain (kredit independen MR-2)
  dependency_rule: 'MR-2: pemeriksaan bernilai 0 bila isian yang dibutuhkannya kosong atau tidak terbaca;
    tanpa gerbang nol global. Formulir tanpa isian sama sekali = 0 untuk K1–K3 (MR-6)'

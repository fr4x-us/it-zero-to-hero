    text: Kasus uji usia = 12 mengungkap kesalahan
  - id: b
    text: Kasus uji usia = 20 mengungkap kesalahan
  - id: c
    text: Kesalahan terjadi karena memakai > padahal aturannya ≥
  - id: d
    text: Langkah itu benar karena hasilnya benar untuk usia 20 dan 5

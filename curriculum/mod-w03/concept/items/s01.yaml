# W3 — bank soal penjelasan konsep (D-23; kunci tidak ditampilkan sebelum dinilai)
slot_id: mod-w03.concept.s01
competency: comp-w03-net-01
required_concepts:
- LAN vs internet
- peran router
- peran switch
format: CE-S1
max_points: 4
content_version: '1.0'
validation:
- CE-V1 kosong → 0 poin
- CE-V2 ID tidak dikenal → 0 poin, INVALID_ANSWER
- CE-V3 ID ganda → 0 poin, INVALID_ANSWER
- CE-V4 bentuk salah → 0 poin, INVALID_ANSWER
- CE-V5 jawaban sebagian dinilai sesuai format
- CE-V7 kunci hilang/konten rusak → EVALUATION_ERROR, bukan 0 poin
feedback_stage: Kunci dan umpan balik ditampilkan setelah attempt dinilai
variants:
- item_id: item-w03-c-s01-a
  variant_id: mod-w03.concept.s01.vA
  item_version: '2.0'
  stem: Laptop dan printer tersambung **kabel** ke satu kotak "router Wi-Fi" rumah yang berisi fungsi
    switch, access point, dan router. Sambungan internet dari ISP **putus**, tetapi laptop masih dapat
    mencetak ke printer. Pernyataan mana yang menjelaskan kejadian ini dengan **fungsi** yang benar?
  options:
  - id: a
    text: Fungsi router meneruskan data dari laptop ke printer di dalam LAN, sedangkan fungsi switch hanya
      dipakai untuk menuju internet
  - id: b
    text: 'Laptop dan printer satu LAN: fungsi switch meneruskan data ke printer di LAN itu; fungsi router
      hanya diperlukan untuk paket ke jaringan lain'
  - id: c
    text: Fungsi switch dan fungsi router sama-sama menghubungkan LAN dengan internet, jadi saat internet
      putus salah satunya menggantikan yang lain
  - id: d
    text: Fungsi access point yang meneruskan data kabel dari laptop ke printer, karena access point juga
      memancarkan Wi-Fi di rumah itu
  key: b
  distractor_rationale:
    a: 'Fungsi tertukar: router menghubungkan jaringan berbeda; switch meneruskan data di dalam LAN'
    c: Switch tidak menghubungkan LAN dengan jaringan lain; fungsi keduanya berbeda
    d: Access point hanya memberi akses nirkabel; laptop dan printer di soal ini memakai kabel
  credit_rule: 4 bila pilihan = kunci; selain itu 0
  feedback: Satu kotak router Wi-Fi berisi beberapa fungsi. Data laptop → printer tetap di dalam LAN dan
    diteruskan fungsi switch; fungsi router hanya dibutuhkan untuk meneruskan paket ke jaringan lain,
    jadi internet putus tidak menghentikan pencetakan.
- item_id: item-w03-c-s01-b
  variant_id: mod-w03.concept.s01.vB
  item_version: '2.0'
  stem: Di lab sekolah, 20 komputer tersambung kabel hanya ke sebuah **switch**; tidak ada router. Komputer-komputer
    itu dapat saling berbagi berkas, tetapi tidak dapat membuka situs di internet. Pernyataan mana yang
    menjelaskan kejadian ini dengan **fungsi** yang benar?
  options:
  - id: a
    text: Switch dapat meneruskan paket ke internet, tetapi komputer berkabel memerlukan access point
      agar dapat keluar ke internet
  - id: b
    text: Switch tidak meneruskan data apa pun; berbagi berkas antarkomputer di lab itu sebenarnya berjalan
      lewat internet sekolah
  - id: c
    text: Router yang meneruskan data antarkomputer di dalam LAN lab, jadi tanpa router berbagi berkas
      seharusnya tidak berjalan
  - id: d
    text: Switch meneruskan data di dalam LAN lab, jadi berbagi berkas berjalan; situs ada di jaringan
      lain dan memerlukan fungsi router
  key: d
  distractor_rationale:
    a: Access point hanya memberi akses nirkabel; yang menghubungkan LAN dengan jaringan lain adalah router
    b: Berbagi berkas berjalan justru karena switch meneruskan data di dalam LAN
    c: 'Fungsi tertukar: di dalam LAN data diteruskan switch; router untuk antarjaringan'
  credit_rule: 4 bila pilihan = kunci; selain itu 0
  feedback: Switch bekerja di dalam satu LAN, jadi berbagi berkas berjalan; situs berada di jaringan lain,
    sehingga perlu fungsi router.

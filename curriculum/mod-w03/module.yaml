# W3 — ikhtisar modul (TPL-01, TPL-02, TPL-03, TPL-15, TPL-17, TPL-18). Dokumentasi konten; bukan kode aplikasi.
module_id: mod-w03
phase: phase-1
week: 3
title: "Jaringan Komputer"
locked_scope: "W3 jaringan (B01 M-02, D-01 M-02; CUR §2 baris 3: alamat, protokol dasar, model lapisan; lab simulasi alamat/subnet sederhana)"
language: id
content_version: "1.0"
status:
  documentation: PRODUCED          # konten lengkap ditulis (CB-1)
  reviewed: CLAUDE_SELF_REVIEW     # review dokumentasi oleh penyusun; lihat review.md
  owner_accepted: NO               # dikoreksi (PR #27, F-28–F-70); menunggu re-review independen dan penerimaan owner
  runtime_verified: NOT_APPLICABLE # W3 tidak memakai runtime Python atau jaringan nyata; aplikasi belum ada
  learner_tested: NO               # estimasi durasi belum diuji dengan pelajar
audience: "Pemula total tanpa pengalaman IT atau pemrograman; telah menyelesaikan W1–W2"
prerequisites: [mod-w02]
nominal_minutes: 480
objective_source: "Topik dan tujuan ringkas CUR §2 baris 3 (kerangka D-01 M-02). Rumusan LO rinci disusun penyusun mengikuti pola W1 (CU-1 tetap PROPOSED) — bukan keputusan owner baru"
network_model: "Model W3: IPv4 desimal; privat RFC 1918; alamat valid lain (bukan 127.x) disebut publik; mask hanya 255.255.255.0 (/24) agar tidak membutuhkan hitungan bit (W6); kecepatan ideal desimal"

learning_objectives:
  - id: LO1
    competency: comp-w03-net-01
    text: "Menjelaskan LAN, WAN, dan internet, peran switch, access point, router, dan modem, serta klien dan server"
  - id: LO2
    competency: comp-w03-ip-01
    text: "Menentukan apakah alamat IPv4 valid dan membedakan alamat privat dan publik"
  - id: LO3
    competency: comp-w03-subnet-01
    text: "Dengan mask 255.255.255.0, menentukan alamat jaringan, broadcast, rentang host, keanggotaan jaringan, gateway yang sah, dan jumlah alamat dalam suatu rentang"
  - id: LO4
    competency: comp-w03-proto-01
    text: "Menjelaskan fungsi DHCP, DNS, HTTP, HTTPS (port 80/443), TCP, dan UDP, dan menentukan protokol yang bermasalah dari gejala"
  - id: LO5
    competency: comp-w03-layer-01
    text: "Memetakan protokol dan perangkat ke empat lapisan TCP/IP dan mengurutkan pembungkusan/pembukaan data"
  - id: LO6
    competency: comp-w03-rate-01
    text: "Mengonversi Mbps dan MB/s serta menghitung waktu transfer ideal dengan aturan desimal"

objective_mapping:   # setiap LO diajarkan, dilatih, dan dinilai

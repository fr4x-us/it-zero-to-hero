# W3 — pemeriksaan lab (kunci; tidak ditampilkan sebelum dievaluasi)
activity_id: mod-w03.lab.act-02
name: Perhitungan jaringan /24
competencies:
- comp-w03-subnet-01
max_points: 40
estimated_minutes: 35
content_version: '1.0'
xp: Tidak ada identitas XP per aktivitas; XP pada identitas komponen mod-w03.lab (D-28 XI-2)
normalization: 'Alamat: buang spasi tepi; empat oktet desimal 0–255 tanpa nol di depan; cocok persis.
  Ditolak: nol di depan, spasi di dalam, oktet ≠ 4, akhiran "/24". c05: bilangan bulat (boleh diikuti
  "alamat"). c06–c08: "Ya" atau "Tidak" (huruf besar/kecil bebas)'
answer_validation: Kosong atau bentuk ditolak → 0 untuk pemeriksaan itu; pemeriksaan lain tetap dinilai
infrastructure: Kegagalan infrastruktur/konten → EVALUATION_ERROR, evaluasi diulang dari submission yang
  sama tanpa attempt baru (D-24 IE-2)
feedback_stage: 'Setelah aktivitas dievaluasi: benar/salah per pemeriksaan + pembahasan. W3 tidak memiliki
  test kode tersembunyi (D-36 HF-A tidak berlaku)'
runtime: Tidak memerlukan runtime Python atau jaringan nyata; pemeriksaan deterministik atas jawaban terstruktur
network_assumptions: 'Model W3: IPv4 desimal; privat = RFC 1918 (10/8, 172.16–172.31, 192.168/16); alamat
  valid lain (bukan 127.x) = publik; mask hanya 255.255.255.0 (/24); kecepatan ideal desimal'

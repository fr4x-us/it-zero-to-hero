# W1 — bank soal penjelasan konsep (D-23; kunci tidak ditampilkan sebelum dinilai)
slot_id: mod-w01.concept.s06
competency: comp-w01-spec-01
required_concepts:
- soket
- jenis RAM dan slot
- daya PSU
- semua syarat dan anggaran
format: CE-S2
max_points: 3
content_version: '1.0'
validation:
- CE-V1 kosong → 0 poin
- CE-V2 ID tidak dikenal → 0 poin, INVALID_ANSWER
- CE-V3 ID ganda → 0 poin, INVALID_ANSWER
- CE-V4 bentuk salah → 0 poin, INVALID_ANSWER
- CE-V5 jawaban sebagian dinilai sesuai format
- CE-V7 kunci hilang/konten rusak → EVALUATION_ERROR, bukan 0 poin
feedback_stage: Kunci dan umpan balik ditampilkan setelah attempt dinilai
variants:
- item_id: item-w01-c-s06-a
  variant_id: mod-w01.concept.s06.vA
  item_version: '1.0'
  stem: Pilih **semua** pernyataan yang benar tentang kompatibilitas.
  options:
  - id: a
    text: Soket CPU harus sama dengan soket motherboard
  - id: b
    text: RAM DDR5 hanya dapat dipasang di motherboard yang mendukung DDR5
  - id: c
    text: Daya PSU harus lebih besar atau sama dengan kebutuhan daya
  - id: d
    text: Komponen yang lebih mahal selalu kompatibel
  - id: e
    text: Jumlah keping RAM boleh melebihi jumlah slot
  key:
  - a
  - b
  - c
  credit_rule: max(0, benar_dipilih − salah_dipilih); penuh hanya bila himpunan tepat sama dengan kunci;
    pengurangan hanya di soal ini
  distractor_rationale:
    d: Harga tidak menentukan kecocokan
    e: Setiap keping butuh satu slot
  feedback: Kompatibilitas ditentukan soket, jenis RAM, jumlah slot, dan daya.
- item_id: item-w01-c-s06-b
  variant_id: mod-w01.concept.s06.vB
  item_version: '1.0'
  stem: Pilih **semua** pernyataan yang benar tentang memilih komputer sesuai kebutuhan.
  options:
  - id: a
    text: Kombinasi memenuhi kebutuhan hanya bila semua syarat dan anggaran terpenuhi
  - id: b
    text: SSD membantu program dan berkas terbuka lebih cepat
  - id: c
    text: RAM yang cukup membantu saat banyak aplikasi terbuka bersamaan
  - id: d
    text: GHz tertinggi selalu berarti komputer tercepat untuk semua tugas
  - id: e
    text: Bila satu syarat tidak terpenuhi, kombinasi tetap memenuhi asalkan murah
  key:
  - a
  - b
  - c
  credit_rule: max(0, benar_dipilih − salah_dipilih); penuh hanya bila himpunan tepat sama dengan kunci;
    pengurangan hanya di soal ini
  distractor_rationale:
    d: Kinerja dipengaruhi banyak faktor
    e: Semua syarat wajib terpenuhi
  feedback: Setiap syarat diperiksa satu per satu; satu syarat gagal berarti tidak memenuhi.

# W1 — bank soal penjelasan konsep (D-23; kunci tidak ditampilkan sebelum dinilai)
slot_id: mod-w01.concept.s02
competency: comp-w01-cpu-01
required_concepts:
- core
- pekerjaan yang dapat dibagi vs berurutan
format: CE-S2
max_points: 2
content_version: '1.0'
validation:
- CE-V1 kosong → 0 poin
- CE-V2 ID tidak dikenal → 0 poin, INVALID_ANSWER
- CE-V3 ID ganda → 0 poin, INVALID_ANSWER
- CE-V4 bentuk salah → 0 poin, INVALID_ANSWER
- CE-V5 jawaban sebagian dinilai sesuai format
- CE-V7 kunci hilang/konten rusak → EVALUATION_ERROR, bukan 0 poin
feedback_stage: Kunci dan umpan balik ditampilkan setelah attempt dinilai
variants:
- item_id: item-w01-c-s02-a
  variant_id: mod-w01.concept.s02.vA
  item_version: '1.0'
  stem: CPU 8 core dan CPU 4 core berasal dari generasi dan GHz yang sama. Pilih **semua** alasan CPU
    8 core dapat membuat **banyak aplikasi** berjalan lebih lancar.
  options:
  - id: a
    text: Core tambahan menambah kapasitas SSD
  - id: b
    text: Pekerjaan dari banyak aplikasi dapat dikerjakan bersamaan di core yang berbeda
  - id: c
    text: Setiap program otomatis menjadi dua kali lebih cepat
  - id: d
    text: Manfaat core tambahan bergantung pada apakah pekerjaannya dapat dibagi
  key:
  - b
  - d
  credit_rule: max(0, benar_dipilih − salah_dipilih); penuh hanya bila himpunan tepat sama dengan kunci;
    pengurangan hanya di soal ini, tidak pernah negatif
  distractor_rationale:
    a: Core tidak memengaruhi penyimpanan
    c: Program yang tidak dapat membagi pekerjaannya tidak menjadi lebih cepat
  feedback: Satu pernyataan benar menjelaskan mekanisme (pekerjaan banyak aplikasi dikerjakan bersamaan
    di core berbeda), satu lagi syaratnya (manfaat bergantung pada pekerjaan yang dapat dibagi).
- item_id: item-w01-c-s02-b
  variant_id: mod-w01.concept.s02.vB
  item_version: '1.0'
  stem: CPU 8 core dan CPU 4 core berasal dari generasi dan GHz yang sama. Sebuah program mengerjakan
    langkahnya **satu per satu**. Pilih **semua** pernyataan yang benar.
  options:
  - id: a
    text: Program itu tidak otomatis lebih cepat di CPU 8 core
  - id: b
    text: Program itu pasti dua kali lebih cepat di CPU 8 core
  - id: c
    text: Core tambahan hanya membantu bila pekerjaan dapat dibagi
  - id: d
    text: Core tambahan menambah kapasitas RAM
  key:
  - a
  - c
  credit_rule: max(0, benar_dipilih − salah_dipilih); penuh hanya bila himpunan tepat sama dengan kunci;
    pengurangan hanya di soal ini, tidak pernah negatif
  distractor_rationale:
    b: Pekerjaan berurutan tidak terbagi ke core lain
    d: Core tidak memengaruhi RAM
  feedback: Satu pernyataan benar menjelaskan akibat (program berurutan tidak otomatis lebih cepat), satu
    lagi syaratnya (core hanya membantu pekerjaan yang dapat dibagi).

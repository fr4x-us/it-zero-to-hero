  variant_id: mod-w01.concept.s02.vB
  item_version: '1.0'
  stem: Pilih **semua** pernyataan yang benar tentang kecepatan clock (GHz).
  options:
  - id: a
    text: 1 GHz berarti 1 miliar siklus per detik
  - id: b
    text: Dua CPU berbeda generasi tidak cukup dibandingkan dari GHz saja
  - id: c
    text: GHz menunjukkan kapasitas RAM
  - id: d
    text: GHz tertinggi selalu tercepat untuk semua tugas
  key:
  - a
  - b
  credit_rule: max(0, benar_dipilih − salah_dipilih); penuh hanya bila himpunan tepat sama dengan kunci;
    pengurangan hanya di soal ini
  distractor_rationale:

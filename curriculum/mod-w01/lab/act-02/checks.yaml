# W1 — pemeriksaan lab (kunci; tidak ditampilkan sebelum dievaluasi)
activity_id: mod-w01.lab.act-02
name: Alur IPOS dan lapisan software
competencies:
- comp-w01-ipos-01
- comp-w01-sw-01
max_points: 30
estimated_minutes: 30
content_version: '1.0'
xp: Tidak ada identitas XP per aktivitas; XP pada identitas komponen mod-w01.lab (D-28 XI-2)
normalization: 'c01: barisan ID kejadian dari himpunan {A, B, C, D}; buang spasi, ubah ke huruf besar;
  harus memuat tepat 4 ID berbeda. c02–c05: satu kode tahap dari {I, P, O, S}, huruf besar. c06: satu
  huruf opsi dari {a, b, c, d}, huruf kecil. Tidak ada aturan angka'
answer_validation: 'c01: kosong, ID di luar {A–D}, ID ganda, atau panjang ≠ 4 → 0 (INVALID_ANSWER); selain
  itu adjacency 0/4/8/12. c02–c06: kosong atau kode di luar himpunan → 0 untuk pemeriksaan itu; pemeriksaan
  lain tetap dinilai'
infrastructure: Kegagalan infrastruktur/konten → EVALUATION_ERROR, evaluasi diulang dari submission yang
  sama tanpa attempt baru (D-24 IE-2)
feedback_stage: 'Setelah aktivitas dievaluasi: benar/salah per pemeriksaan + pembahasan. Umpan balik test
  tersembunyi mengikuti D-36 (HF-A); W1 tidak memiliki test kode tersembunyi'
runtime: Tidak memerlukan runtime Python; pemeriksaan deterministik atas jawaban terstruktur

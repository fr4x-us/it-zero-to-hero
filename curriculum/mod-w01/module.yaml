learning_objectives:
  - id: LO1
    competency: comp-w01-ipos-01
    text: "Membedakan hardware dan software serta menentukan tahap input, proses, output, dan penyimpanan pada kegiatan nyata, termasuk perangkat input-dan-output"
  - id: LO2
    competency: comp-w01-cpu-01
    text: "Menjelaskan peran CPU dan menafsirkan jumlah core serta kecepatan clock (GHz) untuk jenis pekerjaan yang berbeda"
  - id: LO3
    competency: comp-w01-mem-01
    text: "Membedakan RAM (volatil) dan penyimpanan non-volatil, serta SSD dan HDD, dan menjelaskan akibatnya"
  - id: LO4
    competency: comp-w01-unit-01
    text: "Mengonversi satuan data (bit, byte, KB–TB, aturan desimal) dan menghitung kapasitas penyimpanan"
  - id: LO5
    competency: comp-w01-sw-01
    text: "Membedakan software sistem (OS, firmware, driver, utilitas) dan aplikasi, serta mengurutkan lapisan software dan proses boot"
  - id: LO6
    competency: comp-w01-spec-01
    text: "Memeriksa kompatibilitas (soket, jenis RAM, slot, daya) dan memilih kombinasi komponen yang memenuhi semua kebutuhan dan anggaran"


    name: Penjelasan proyek (komposisi K-A, 5 × CE-S1, P = 2)
    points: 10
    note: 'Soal tentang tugas proyek ini; terpisah dari komponen Concept explanation W8 (D-33 A.2a). Posisi
      kunci: d, a, c, b, d'
    items:
    - id: mod-w08.project.K4.q1
      lo: comp-w08-correct-01
      stem: Mengapa satu daftar uji yang menghasilkan output benar belum membuktikan flowchart benar?
      options:
        a: Karena output selalu salah
        b: Karena daftar uji harus berisi tepat 6 nilai
        c: Karena flowchart tidak boleh diuji
        d: Karena pilihan blok yang salah bisa kebetulan benar untuk daftar tertentu; kebenaran harus
          berlaku untuk semua daftar dalam domain
      key: d
      points: 2
      feedback: Pilih beberapa kasus uji yang mengincar kesalahan umum (W8 pelajaran 4).
    - id: mod-w08.project.K4.q2
      lo: comp-w08-loop-01
      stem: Blok mana pada templat yang membuat perulangan bergerak menuju berhenti?
      options:
        a: B7 `i ← i + 1`
        b: B6 `maks ← A[i]`
        c: B9 Output maks
        d: B1 Mulai
      key: a
      points: 2
      feedback: Variabel pengendali harus berubah mendekati syarat berhenti (W8 pelajaran 3).
    - id: mod-w08.project.K4.q3
      lo: comp-w08-branch-01
      stem: Pada templat, bila keputusan B5 bernilai Ya, apa yang terjadi?
      options:
        a: Flowchart langsung selesai
        b: i dikembalikan ke 2
        c: '`maks` diganti A[i], lalu lanjut ke B7'
        d: Output maks ditampilkan
      key: c
      points: 2
      feedback: 'Ikuti kolom "Berikutnya" pada tabel blok: B5 Ya → B6 → B7.'
    - id: mod-w08.project.K4.q4
      lo: comp-w08-symbol-01
      stem: Mengapa B5 berbentuk belah ketupat?
      options:
        a: Karena B5 memberi nilai pada variabel
        b: Karena B5 adalah keputusan dengan dua jalur keluar, Ya dan Tidak
        c: Karena B5 adalah input
        d: Karena B5 adalah akhir flowchart
      key: b
      points: 2
      feedback: Belah ketupat = keputusan; selalu punya dua cabang (W8 pelajaran 2).
    - id: mod-w08.project.K4.q5
      lo: comp-w08-trace-01
      stem: Pada tabel penelusuran, mengapa nilai `maks` dapat sama pada beberapa baris berturut-turut?
      options:
        a: Karena perulangan berhenti
        b: Karena i tidak berubah
        c: Karena tabel penelusuran selalu berisi nilai yang sama
        d: Karena bila B5 bernilai Tidak, B6 dilewati sehingga `maks` tidak berubah pada putaran itu
      key: d
      points: 2
      feedback: Nilai lama tetap berlaku sampai diganti (W8 pelajaran 3).
point_check: K1 4×6 + 5×4 + 6 + 5 + 5 = 60; K2 4×2 + 6 + 3×2 = 20; K3 4+3+3 = 10; K4 5×2 = 10; total 100
solution_analysis:
  blocks: 'Kombinasi F1–F4 bernilai penuh: 2 (F1 = b, F2 = b, F3 = a atau d, F4 = b), diverifikasi dengan
    interpreter tingkat-blok yang menjalankan 4⁴ = 256 kombinasi pada 14 daftar uji (negatif, positif,
    campuran, nilai sama, satu nilai). F4 = c (kembali ke B5) melewati penjaga B4 dan mengakses A[n +
    1] (di luar daftar); F4 = a tidak berhenti untuk n ≥ 2; F4 = d keluar setelah satu putaran'
  values: F5–F8 tunggal
  total_full_score_sets: 2
  reference_strict:
    F1: b
    F2: b
    F3: a
    F4: b
    F5:
      i2: '-2'
      i3: '-2'
      i4: '5'
      i5: '5'
      i6: '5'
    F6: '-3'
    F7: '0'
    F8: '6'

# W8 — rubrik mini-project (MR-A, D-33). Kunci, contoh jawaban, dan contoh evaluasi
# hanya untuk reviewer/penilai; tidak ditampilkan kepada pelajar sebelum dinilai.
component: mod-w08.project
content_version: '1.0'
max_points: 100
constants:
  flowchart_template:
  - - B1
    - Oval
    - Mulai
    - B2
  - - B2
    - Jajar genjang
    - Input daftar A berisi n nilai
    - B3
  - - B3
    - Persegi panjang
    - '[F1]; i ← 2'
    - B4
  - - B4
    - Belah ketupat
    - '[F2]'
    - Ya → B5; Tidak → B9
  - - B5
    - Belah ketupat
    - '[F3]'
    - Ya → B6; Tidak → B7
  - - B6
    - Persegi panjang
    - maks ← A[i]
    - B7
  - - B7
    - Persegi panjang
    - i ← i + 1
    - B8
  - - B8
    - Penghubung
    - kembali ke [F4]
    - '[F4]'
  - - B9
    - Jajar genjang
    - Output maks
    - B10
  - - B10
    - Oval
    - Selesai
    - —
  domain: Daftar A berisi n ≥ 1 bilangan bulat (boleh negatif, boleh sama); A[1] nilai pertama
  options:
    F1:
      a: maks ← 0
      b: maks ← A[1]
      c: maks ← n
      d: maks ← A[n]
    F2:
      a: i < n?
      b: i ≤ n?
      c: i ≥ n?
      d: i = n?
    F3:
      a: A[i] > maks?
      b: A[i] < maks?
      c: A[i] = maks?
      d: A[i] ≥ maks?
    F4:
      a: B3
      b: B4
      c: B5
      d: B9
  list_A:
  - -7
  - -2
  - -2
  - 5
  - 3
  - -9
  list_B:
  - -8
  - -3
  - -5
  key:
    F1:
    - b
    F2:
    - b
    F3:
    - a
    - d
    F4:
    - b
    F5:
      i2: -2
      i3: -2
      i4: 5
      i5: 5
      i6: 5
    F6: -3
    F7: 0
    F8: 6
  equivalent_choices: 'F3: `A[i] > maks?` dan `A[i] ≥ maks?` sama-sama benar (nilai sama tidak mengubah
    nilai maks). Enumerasi 4⁴ = 256 kombinasi F1–F4 pada 14 daftar uji dengan interpreter tingkat-blok
    (termasuk semua negatif, nilai sama, satu nilai): tepat 2 kombinasi benar, keduanya diterima'
  trace_note: F5 berisi nilai maks setelah blok B5/B6 pada setiap putaran i = 2 … 6 untuk daftar A; nilainya
    sama untuk > maupun ≥
field_rules:
  choice_readable: Satu huruf a–d (huruf besar/kecil bebas); selain itu tidak terbaca
  number_readable: NB-5 bilangan bulat (tanda `-` atau `−` untuk negatif, tanpa nol di depan); F5–F7 boleh
    diawali `maks =` atau `maks=`; F8 boleh diikuti `kali`. Akhiran kata/simbol satuan dibaca tanpa membedakan
    huruf besar/kecil (mis. `PERSEN`, `Kali`); awalan `Rp` ditulis persis (kontrak NB-5 N3–N4).
  number_strict: 'K3: bilangan saja (tanpa `maks =` atau kata)'
  validity: 'Isian kosong/tidak terbaca → INVALID_ANSWER untuk isian itu saja; pemeriksaan yang depends_on
    isian itu bernilai 0; isian lain tetap dinilai. F5: baris i2–i6 yang hilang = sel kosong; ID baris
    tak dikenal diabaikan; struktur luar rusak (bukan tabel baris) → seluruh F5 tidak terbaca. Kegagalan
    aplikasi/konten → EVALUATION_ERROR (D-24 IE-2), bukan skor 0'
  value_compare: Setiap isian dibandingkan dengan kunci yang diturunkan dari flowchart acuan dan daftar
    fixture, bukan dari pilihan blok pelajar (kredit independen MR-2)
  dependency_rule: 'MR-2: pemeriksaan bernilai 0 bila isian yang dibutuhkannya kosong atau tidak terbaca;
    tanpa gerbang nol global. Formulir tanpa isian sama sekali = 0 untuk K1–K3 (MR-6)'

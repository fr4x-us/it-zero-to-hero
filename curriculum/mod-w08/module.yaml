objective_source: "Topik dan tujuan ringkas CUR §2 baris 8 (kerangka D-01 M-02). Rumusan LO rinci disusun penyusun mengikuti pola W1–W7 (CU-1 tetap PROPOSED) — bukan keputusan owner baru"
flowchart_representation: "Flowchart ditulis sebagai tabel blok bernomor (bentuk, isi, blok berikutnya). Pelajar memilih isi blok kosong dari daftar dan mengisi tabel penelusuran; tidak ada editor graf atau evaluator graf baru. Format editor flowchart di aplikasi tetap OPEN (CUR §6, M-10)"
notation: "← berarti pemberian nilai; ≤, ≥, <, >, = perbandingan; A[i] nilai ke-i daftar (mulai 1). Notasi kertas, bukan sintaks Python (W9+)"

learning_objectives:
  - id: LO1
    competency: comp-w08-algo-01
    text: "Menjelaskan algoritma sebagai input–proses–output yang berhenti, dan menyatakan asumsi domain input"
  - id: LO2
    competency: comp-w08-symbol-01
    text: "Membaca dan menyusun flowchart dengan simbol oval, jajar genjang, persegi panjang, belah ketupat, dan panah"
  - id: LO3
    competency: comp-w08-branch-01
    text: "Menelusuri percabangan tunggal dan bertingkat, termasuk nilai tepat di batas"
  - id: LO4
    competency: comp-w08-loop-01
    text: "Menelusuri perulangan dengan variabel pengendali, menghitung banyak putaran, dan mengenali perulangan yang tidak berhenti"
  - id: LO5
    competency: comp-w08-trace-01
    text: "Menyusun tabel penelusuran nilai variabel langkah demi langkah"
  - id: LO6
    competency: comp-w08-correct-01
    text: "Memeriksa kebenaran algoritma: nilai awal, nilai sama, nilai negatif, dan kasus uji yang mengungkap kesalahan"


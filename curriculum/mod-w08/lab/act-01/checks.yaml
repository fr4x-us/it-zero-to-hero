# W8 — pemeriksaan lab (kunci; tidak ditampilkan sebelum dievaluasi)
activity_id: mod-w08.lab.act-01
name: Percabangan pada flowchart
competencies:
- comp-w08-symbol-01
- comp-w08-branch-01
- comp-w08-algo-01
max_points: 30
estimated_minutes: 40
content_version: '1.0'
xp: Tidak ada identitas XP per aktivitas; XP pada identitas komponen mod-w08.lab (D-28 XI-2)
normalization: 'c01–c04: Buang spasi/tab di awal dan akhir; cocokkan persis dengan salah satu accepted_answers.
  Aturan angka NB-5: bilangan bulat tanpa nol di depan; pemisah desimal hanya koma (`12,5`) dengan tepat
  sebanyak angka desimal yang diminta; titik hanya sebagai pemisah ribuan dengan kelompok tepat tiga digit
  (`1.250`); tanda minus `-` atau `−` hanya untuk bilangan negatif; satuan yang disebut di soal boleh
  ditulis setelah angka dengan/tanpa satu spasi (huruf besar/kecil satuan bebas); untuk rupiah boleh diawali
  `Rp` dengan/tanpa spasi. Ditolak: titik sebagai desimal (`12.5`), nol di depan, pecahan (`1/2`), kata,
  satuan lain, angka desimal lebih/kurang dari yang diminta. Jawaban bilangan bulat (tanda minus untuk
  negatif) (boleh diawali Rp). c05, c06: Pilihan: satu huruf a–d, huruf besar/kecil bebas'
answer_validation: Kosong atau bentuk ditolak → 0 untuk pemeriksaan itu (INVALID_ANSWER bila bentuk tidak
  sah); pemeriksaan lain tetap dinilai (kredit independen)
infrastructure: Kegagalan infrastruktur/konten → EVALUATION_ERROR, evaluasi diulang dari submission yang
  sama tanpa attempt baru (D-24 IE-2); bukan skor 0
feedback_stage: 'Setelah aktivitas dievaluasi: benar/salah per pemeriksaan + pembahasan. W8 tidak memiliki
  test kode tersembunyi (D-36 HF-A tidak berlaku)'
runtime: Tidak memerlukan runtime Python; pemeriksa deterministik per jenis (EB-4, D-24) atas angka dan
  pilihan; Flowchart ditulis sebagai tabel blok bernomor (bentuk, isi, blok berikutnya); tidak ada editor
  graf. Format editor flowchart di aplikasi belum diputuskan (CUR §6, M-10)
